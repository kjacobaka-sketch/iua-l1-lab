  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
/* =====================================================
   style.css : couleurs, mise en page, menu latéral, en-tête
   (les blocs, menus et animations sont dans blocs.css)
   ===================================================== */

/* ---------- Couleurs ---------- */
:root {
  --fond: #f7f6fb;
  --carte: #ffffff;
  --texte: #1d1b2a;
  --discret: #8a86a0;
  --ligne: #e8e5f2;
  --survol: #f0eefa;
  --ombre: 0 10px 30px rgba(40, 30, 90, .12);
  --ombre-douce: 0 2px 10px rgba(40, 30, 90, .08);
  --danger: #e5484d;
  --rayon: 14px;
  --clavier: 0px;
  color-scheme: light;
}

/* Thème sombre : automatique, ou choisi à la main */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="clair"]) {
    --fond: #14131c;
    --carte: #1d1c29;
    --texte: #ecebf5;
    --discret: #8f8ca8;
    --ligne: #2b2a3a;
    --survol: #262535;
    --ombre: 0 10px 30px rgba(0, 0, 0, .45);
    --ombre-douce: 0 2px 10px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="sombre"] {
  --fond: #14131c;
  --carte: #1d1c29;
  --texte: #ecebf5;
  --discret: #8f8ca8;
  --ligne: #2b2a3a;
  --survol: #262535;
  --ombre: 0 10px 30px rgba(0, 0, 0, .45);
  --ombre-douce: 0 2px 10px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

/* Couleur de la page (change tout l'accent de l'interface) */
body                      { --accent: #7c5cff; --accent-2: #b08cff; }
body[data-couleur="bleu"] { --accent: #2f80ed; --accent-2: #56c2ff; }
body[data-couleur="vert"] { --accent: #14b571; --accent-2: #7be0a8; }
body[data-couleur="orange"] { --accent: #ff7a1a; --accent-2: #ffc24d; }
body[data-couleur="rose"] { --accent: #ff4d8d; --accent-2: #ff9ec1; }
body[data-couleur="turquoise"] { --accent: #0fb5b0; --accent-2: #6fe3d8; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--fond);
  color: var(--texte);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;               /* 16px : évite le zoom automatique sur iPhone */
  line-height: 1.5;
  transition: background .4s, color .4s;
}

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [contenteditable]:focus-visible, .sep:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

[contenteditable]:empty::before {
  content: attr(data-placeholder);
  color: var(--discret);
  opacity: .7;
  pointer-events: none;
}


/* ---------- Disposition ---------- */
.app { display: flex; min-height: 100vh; min-height: 100dvh; }
.principal { flex: 1; min-width: 0; margin-left: 290px; }

.haut { display: none; }


/* ---------- Menu latéral ---------- */
.lateral {
  position: fixed;
  inset: 0 auto 0 0;
  width: 290px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px 14px calc(16px + env(safe-area-inset-bottom));
  background: var(--carte);
  border-right: 1px solid var(--ligne);
  z-index: 40;
  transition: transform .35s cubic-bezier(.2, .8, .2, 1), background .4s;
}

.lateral-tete {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px 4px;
  font-size: 1.15rem;
}

.logo {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 45%, transparent);
  transition: background .4s;
}

.recherche {
  width: 100%;
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--ligne);
  border-radius: 12px;
  background: var(--fond);
  color: var(--texte);
  font: inherit;
  transition: border-color .2s, box-shadow .2s;
}
.recherche:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}

.liste-pages {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  margin: 0 -4px;
  padding: 0 4px;
}

.vide { color: var(--discret); text-align: center; margin: 20px 0; }

.page-item {
  display: flex;
  align-items: center;
  border-radius: 12px;
  transition: background .2s, transform .2s;
  animation: glisse-droite .4s both;
}
.page-item:nth-child(2) { animation-delay: .04s; }
.page-item:nth-child(3) { animation-delay: .08s; }
.page-item:nth-child(4) { animation-delay: .12s; }
.page-item:hover { background: var(--survol); }
.page-item.actif {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  font-weight: 600;
}

.page-ouvrir {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 46px;
  padding: 0 10px;
  border: 0;
  background: none;
  text-align: left;
}
.page-icone { font-size: 1.15rem; }
.page-nom { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.point { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #7c5cff; }
.point[data-c="bleu"] { background: #2f80ed; }
.point[data-c="vert"] { background: #14b571; }
.point[data-c="orange"] { background: #ff7a1a; }
.point[data-c="rose"] { background: #ff4d8d; }
.point[data-c="turquoise"] { background: #0fb5b0; }

.page-supprimer {
  width: 40px;
  height: 40px;
  margin-right: 4px;
  border: 0;
  border-radius: 10px;
  background: none;
  color: var(--discret);
  font-size: 1.3rem;
  opacity: 0;
  transition: opacity .2s, color .2s, background .2s;
}
.page-item:hover .page-supprimer, .page-supprimer:focus-visible { opacity: 1; }
.page-supprimer:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
@media (hover: none) { .page-supprimer { opacity: .6; } }

.btn-nouvelle {
  min-height: 48px;
  border: 0;
  border-radius: 14px;
  color: #fff;
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent);
  transition: transform .2s, box-shadow .2s, background .4s;
}
.btn-nouvelle:hover { transform: translateY(-2px); }
.btn-nouvelle:active { transform: scale(.97); }

.lateral-pied { display: flex; flex-direction: column; gap: 6px; }
.btn-doux {
  min-height: 42px;
  border: 1px solid var(--ligne);
  border-radius: 12px;
  background: none;
  color: var(--discret);
  transition: background .2s, color .2s;
}
.btn-doux:hover { background: var(--survol); color: var(--texte); }

.voile {
  position: fixed;
  inset: 0;
  z-index: 39;
  background: rgba(10, 8, 25, .5);
  backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}


/* ---------- Page et en-tête ---------- */
.page {
  position: relative;
  max-width: 780px;
  margin: 0 auto;
  padding: 0 20px 190px;
}

.bandeau {
  height: 150px;
  margin: 0 -20px;
  border-radius: 0 0 28px 28px;
  background:
    radial-gradient(circle at 15% 20%, rgba(255, 255, 255, .35), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(255, 255, 255, .22), transparent 40%),
    linear-gradient(120deg, var(--accent), var(--accent-2));
  background-size: 140% 140%, 140% 140%, 200% 200%;
  animation: bandeau 14s ease-in-out infinite alternate;
}

.entete { position: relative; margin-top: -42px; margin-bottom: 18px; }

.icone-page {
  display: grid;
  place-items: center;
  width: 78px;
  height: 78px;
  border: 4px solid var(--fond);
  border-radius: 24px;
  background: var(--carte);
  font-size: 2.3rem;
  box-shadow: var(--ombre-douce);
  transition: transform .2s, border-color .4s, background .4s;
}
.icone-page:hover { transform: rotate(-6deg) scale(1.06); }
.icone-page.rebond { animation: rebond .55s cubic-bezier(.3, 1.6, .5, 1); }

#titre-page {
  margin: 12px 0 10px;
  font-size: clamp(1.9rem, 6vw, 2.6rem);
  line-height: 1.15;
  font-weight: 800;
  letter-spacing: -.02em;
  outline: none;
  overflow-wrap: anywhere;
}

.couleurs { display: flex; gap: 10px; margin-bottom: 4px; }

.pastille {
  width: 28px;
  height: 28px;
  border: 3px solid var(--fond);
  border-radius: 50%;
  background: #7c5cff;
  box-shadow: 0 0 0 1px var(--ligne);
  transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .2s;
}
.pastille[data-c="bleu"] { background: #2f80ed; }
.pastille[data-c="vert"] { background: #14b571; }
.pastille[data-c="orange"] { background: #ff7a1a; }
.pastille[data-c="rose"] { background: #ff4d8d; }
.pastille[data-c="turquoise"] { background: #0fb5b0; }
.pastille:hover { transform: scale(1.18); }
.pastille.choisie { transform: scale(1.18); box-shadow: 0 0 0 2px var(--accent); }

.progres { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: .9rem; color: var(--discret); }
.progres[hidden] { display: none; }
.progres-barre { flex: 1; height: 10px; overflow: hidden; border-radius: 99px; background: var(--ligne); }
#progres-rempli {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .6s cubic-bezier(.2, .8, .2, 1), background .4s;
}
.progres.complet #progres-texte { color: var(--accent); font-weight: 700; }
.progres.complet #progres-rempli { animation: brille 1.4s ease-in-out infinite; }

.page.change { animation: page-entre .45s cubic-bezier(.2, .8, .2, 1); }


/* ---------- Petit écran (téléphone) ---------- */
@media (max-width: 860px) {
  .principal { margin-left: 0; }

  .lateral { transform: translateX(-102%); width: min(86vw, 320px); box-shadow: var(--ombre); }
  body.menu-ouvert .lateral { transform: none; }
  body.menu-ouvert .voile { opacity: 1; pointer-events: auto; }
  body.menu-ouvert { overflow: hidden; }

  .haut {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    background: color-mix(in srgb, var(--fond) 82%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--ligne);
  }
  .btn-menu {
    width: 44px;
    height: 44px;
    border: 1px solid var(--ligne);
    border-radius: 12px;
    background: var(--carte);
    font-size: 1.2rem;
  }
  .bandeau { height: 120px; }
}


/* ---------- Animations ---------- */
@keyframes bandeau { to { background-position: 100% 100%, 0 0, 100% 50%; } }
@keyframes rebond { 0% { transform: scale(.6) rotate(-14deg); } 100% { transform: none; } }
@keyframes glisse-droite { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@keyframes page-entre { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes brille { 50% { filter: brightness(1.25) saturate(1.2); } }

/* Respecte les personnes qui préfèrent moins d'animations */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
  <style>
/* =====================================================
   blocs.css : les blocs, la barre du bas, les menus, le message
   ===================================================== */

/* ---------- Blocs ---------- */
.bloc {
  position: relative;
  display: flex;
  align-items: flex-start;
  min-height: 44px;
  margin-left: calc(var(--niveau, 0) * 26px);
  border-radius: 12px;
  transition: background .2s, margin .25s cubic-bezier(.2, .8, .2, 1), box-shadow .2s, transform .2s;
}
.bloc:hover, .bloc.actif { background: color-mix(in srgb, var(--accent) 6%, transparent); }

/* Poignée ⋮⋮ à gauche du bloc */
.poignee {
  flex-shrink: 0;
  width: 28px;
  height: 44px;
  margin-left: -4px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--discret);
  display: grid;
  place-items: center;
  cursor: grab;
  touch-action: none;           /* nécessaire pour le glisser-déposer au doigt */
  opacity: 0;
  transition: opacity .2s, background .2s;
}
.poignee svg { width: 10px; height: 16px; fill: currentColor; pointer-events: none; }
.bloc:hover .poignee, .bloc.actif .poignee, .poignee:focus-visible { opacity: 1; }
.poignee:hover { background: var(--survol); }
@media (hover: none) { .poignee { opacity: .55; } }

.contenu { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 10px; padding-right: 8px; }

.texte { flex: 1; min-width: 0; padding: 9px 0; outline: none; overflow-wrap: anywhere; }

/* Types de blocs */
.bloc-titre .texte { font-size: 1.75rem; font-weight: 800; line-height: 1.2; letter-spacing: -.02em; padding-top: 16px; }
.bloc-sous_titre .texte { font-size: 1.3rem; font-weight: 700; line-height: 1.25; padding-top: 12px; }

.bloc-citation .contenu {
  margin: 4px 0;
  padding: 2px 8px 2px 16px;
  border-left: 4px solid var(--accent);
  border-radius: 4px;
  font-style: italic;
  color: color-mix(in srgb, var(--texte) 85%, var(--accent));
  transition: border-color .4s;
}

.puce, .numero { flex-shrink: 0; min-width: 22px; padding-top: 9px; text-align: center; color: var(--accent); font-weight: 700; }
.numero { text-align: right; font-variant-numeric: tabular-nums; }

.sep { flex: 1; display: flex; align-items: center; min-height: 44px; outline: none; cursor: pointer; }
.sep hr { width: 100%; height: 3px; margin: 0; border: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent); opacity: .55; transition: opacity .2s; }
.bloc.actif .sep hr, .sep:hover hr { opacity: 1; }

/* Couleur de fond d'un bloc (choisie dans le menu ⋮⋮) */
.bloc[data-teinte] { background: var(--teinte); }
.bloc[data-teinte="jaune"]  { --teinte: rgba(255, 214, 10, .22); }
.bloc[data-teinte="vert"]   { --teinte: rgba(48, 209, 88, .2); }
.bloc[data-teinte="bleu"]   { --teinte: rgba(10, 132, 255, .18); }
.bloc[data-teinte="rose"]   { --teinte: rgba(255, 55, 120, .17); }
.bloc[data-teinte="violet"] { --teinte: rgba(150, 90, 255, .2); }

/* Case à cocher dessinée en SVG (le trait se dessine quand on coche) */
.case {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  margin-top: 10px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 2px solid var(--discret);
  border-radius: 8px;
  background: transparent;
  transition: background .25s, border-color .25s, transform .25s cubic-bezier(.3, 1.8, .5, 1), box-shadow .25s;
}
.case:hover { border-color: var(--accent); }
.case:active { transform: scale(.85); }
.case svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.case path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .08s ease-out; }
.case[aria-checked="true"] {
  border-color: transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 45%, transparent);
  transform: scale(1.08);
  animation: pop .4s cubic-bezier(.3, 1.8, .5, 1);
}
.case[aria-checked="true"] path { stroke-dashoffset: 0; }

.bloc.fait .texte { color: var(--discret); text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
.texte { transition: color .3s; }

/* Animations des blocs */
.bloc.entree { animation: bloc-entre .38s cubic-bezier(.2, .9, .3, 1.3); }
.bloc.sortie { animation: bloc-sort .18s ease-in forwards; }

/* Glisser-déposer */
.bloc.deplace {
  z-index: 30;
  background: var(--carte);
  box-shadow: var(--ombre);
  transition: box-shadow .2s;
  pointer-events: none;
}
body.glisse { cursor: grabbing; user-select: none; -webkit-user-select: none; }
.bloc.cible-avant::before,
#blocs.cible-fin::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -3px;
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 12px var(--accent);
  animation: pop .25s;
}
#blocs { position: relative; }
#blocs.cible-fin::after { top: auto; bottom: -3px; }

.ajouter-fin {
  display: block;
  width: 100%;
  min-height: 48px;
  margin-top: 10px;
  border: 2px dashed var(--ligne);
  border-radius: 14px;
  background: none;
  color: var(--discret);
  transition: border-color .2s, color .2s, background .2s, transform .15s;
}
.ajouter-fin:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.ajouter-fin:active { transform: scale(.98); }


/* ---------- Barre du bas ---------- */
.barre {
  position: fixed;
  left: 50%;
  bottom: calc(14px + env(safe-area-inset-bottom) + var(--clavier));
  z-index: 25;
  display: flex;
  gap: 4px;
  max-width: calc(100vw - 24px);
  padding: 6px;
  border: 1px solid var(--ligne);
  border-radius: 20px;
  background: color-mix(in srgb, var(--carte) 88%, transparent);
  backdrop-filter: blur(14px);
  box-shadow: var(--ombre);
  transform: translateX(-50%);
  animation: barre-monte .6s .2s cubic-bezier(.2, .9, .3, 1.2) both;
}
@media (min-width: 861px) { .barre { left: calc(50% + 145px); } }

.barre button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-width: 56px;
  min-height: 52px;
  padding: 4px 10px;
  border: 0;
  border-radius: 14px;
  background: none;
  font-size: .72rem;
  color: var(--discret);
  transition: background .2s, color .2s, transform .15s;
}
.barre button span { font-size: 1.05rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
.barre button:hover { background: var(--survol); color: var(--texte); }
.barre button:active { transform: scale(.9); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.barre .plus { flex-direction: row; font-size: .85rem; font-weight: 600; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.barre .plus:hover { color: #fff; filter: brightness(1.08); }

@media (max-width: 420px) {
  .barre button { min-width: 0; flex: 1; padding: 4px 6px; }
}


/* ---------- Menus flottants ---------- */
.menu {
  position: fixed;
  z-index: 50;
  width: 270px;
  max-height: min(70vh, 420px);
  overflow-y: auto;
  padding: 6px;
  border: 1px solid var(--ligne);
  border-radius: 16px;
  background: var(--carte);
  box-shadow: var(--ombre);
  transform-origin: top left;
  animation: menu-ouvre .18s cubic-bezier(.2, .9, .3, 1.2);
}
.menu[hidden] { display: none; }

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 46px;
  padding: 6px 10px;
  border: 0;
  border-radius: 10px;
  background: none;
  text-align: left;
  transition: background .12s;
}
.menu-item.actif { background: color-mix(in srgb, var(--accent) 14%, transparent); }
@media (hover: hover) { .menu-item:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); } }
.menu-item:disabled { opacity: .35; pointer-events: none; }
.menu-item.danger { color: var(--danger); }

.titre-section { margin: 10px 0 -4px; font-size: .68rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; opacity: .9; }
.param-section { display: flex; flex-direction: column; gap: 8px; }

.champ-form input, .champ-form select { border-radius: 10px; }
.btn-primaire, .btn-secondaire, .btn-danger { border-radius: 10px; transition: transform .25s var(--ressort), background .15s, filter .15s; }
.btn-primaire { background: var(--accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 1px 2px rgba(0, 0, 0, .12); }

.ligne-action, .ligne-interrupteur, .ligne-corbeille { border-radius: 12px; }

.ligne-action:active { transform: scale(.985); }
.ligne-icone { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--survol); font-size: 1.15rem; }

.ligne-texte small { font-size: .82rem; }

.segment { border-radius: 11px; padding: 3px; }
.segment button { min-height: 38px; border-radius: 8px; font-size: .92rem; transition: background .25s var(--fluide), color .2s, box-shadow .25s; }
.segment button.actif { box-shadow: 0 0 0 1px var(--ligne), var(--ombre-douce); }
.ligne-interrupteur input { width: 42px; height: 24px; transition: background .25s; }
.ligne-interrupteur input::after { width: 18px; height: 18px; top: 3px; left: 3px; transition: transform .35s var(--ressort); }
.ligne-interrupteur input:checked::after { transform: translateX(18px); }

.carte-stat { border-radius: 12px; background: var(--survol); animation: glisse-droite .5s var(--fluide) both; }
.carte-stat strong { font-weight: 700; letter-spacing: -.02em; }
.barre-haut i { border-radius: 4px 4px 0 0; }
.ligne-avancement .rail { height: 6px; }
.ligne-avancement .rail i { background: var(--accent); }
.vue-ligne { border-radius: 12px; animation: glisse-droite .45s var(--fluide) both; }
.titre-vue { font-weight: 750; letter-spacing: -.03em; }

.pomodoro { border-radius: 16px; box-shadow: 0 0 0 1px var(--ligne), var(--ombre); backdrop-filter: blur(14px); }

.btn-menu { border-radius: 10px; }
@media (max-width: 860px) {
  .lateral { width: min(84vw, 310px); box-shadow: var(--ombre); }
  .principal { margin-left: 0; }
  .haut { background: color-mix(in srgb, var(--fond) 78%, transparent); backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid var(--ligne); }
  .bandeau { height: 104px; }
  .page { padding: 0 18px 200px; }
  .bandeau { margin: 0 -18px; }
}


/* ---------- Animations ---------- */
@keyframes glisse-droite { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes page-entre { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes bloc-entre { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes bloc-sort { to { opacity: 0; transform: translateX(24px); } }
@keyframes menu-ouvre { from { opacity: 0; transform: scale(.95) translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes feuille-monte { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
@keyframes hist-monte { from { opacity: 0; transform: translate(-50%, 24px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes coche { 0% { transform: scale(.7); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes fondu { from { opacity: 0; } to { opacity: 1; } }
@keyframes feuille-entre { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes bandeau { to { background-position: 100% 60%, 0 40%, 0 0; } }

/* Sur téléphone, la fenêtre monte depuis le bas du téléphone */
@media (max-width: 640px) {
  .feuille[open] { animation: feuille-monte .4s var(--fluide); }
}


/* ---------- Actions de la page : favori et options ---------- */
.actions-page { display: flex; align-items: center; gap: 6px; }
.btn-page {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid var(--ligne);
  border-radius: 9px;
  background: var(--carte);
  color: var(--discret);
  font-size: .88rem;
  font-weight: 550;
  transition: background .15s, color .15s, border-color .2s, transform .25s var(--ressort);
}
.btn-page:hover { background: var(--survol); color: var(--texte); }
.btn-page:active { transform: scale(.94); }
.btn-page .etoile { font-size: 1rem; line-height: 1; transition: transform .35s var(--ressort), color .2s; }
.btn-page[aria-pressed="true"] { color: #b7791f; border-color: color-mix(in srgb, #f5b301 45%, var(--ligne)); background: color-mix(in srgb, #f5b301 12%, var(--carte)); }
.btn-page[aria-pressed="true"] .etoile { color: #f5b301; transform: scale(1.15) rotate(72deg); }
:root[data-theme="sombre"] .btn-page[aria-pressed="true"] { color: #f5c44d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="clair"]) .btn-page[aria-pressed="true"] { color: #f5c44d; } }
@media (max-width: 359px) { .btn-page .libelle { display: none; } .btn-page { padding: 0 11px; } }

/* Menu Options de la page */
.resume-page { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; background: var(--survol); }
.resume-page > div { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.resume-page strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resume-page small { color: var(--discret); }
.resume-icone { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--carte); box-shadow: 0 0 0 1px var(--ligne); font-size: 1.5rem; flex-shrink: 0; }
.couleurs .pastille { width: 30px; height: 30px; }
.icones { display: flex; flex-wrap: wrap; gap: 6px; }
.choix-icone { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--ligne); border-radius: 10px; background: none; font-size: 1.25rem; transition: transform .25s var(--ressort), background .15s, border-color .15s; }
.choix-icone:hover { background: var(--survol); transform: translateY(-1px); }
.choix-icone.choisie { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ligne-action.danger { color: var(--danger); }
.ligne-action.danger:hover { border-color: color-mix(in srgb, var(--danger) 55%, var(--ligne)); background: color-mix(in srgb, var(--danger) 8%, transparent); }
.ligne-action.danger small { color: inherit; opacity: .75; }

/* Petite fenêtre de question */
.invite { width: min(92vw, 400px); }
.invite-corps { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.invite-corps h2 { margin: 0; font-size: 1.1rem; font-weight: 650; letter-spacing: -.015em; line-height: 1.3; }
.invite-corps .aide { margin: 0; }
.invite-champ { min-height: 44px; padding: 0 12px; border: 1px solid var(--ligne); border-radius: 10px; background: var(--fond); color: var(--texte); font: inherit; }
.invite-champ:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.invite-corps .actions { justify-content: flex-end; }
.invite-corps .actions button { min-width: 96px; min-height: 42px; }
.invite[open] { animation: feuille-entre .3s var(--fluide); }

/* Impression / PDF : seulement la page */
@media print {
  .lateral, .haut, .barre, .voile, .btn-flottant, .actions-page, .recherche-page, .poignee, .ajouter-fin, .toast, .format, .menu, .bandeau { display: none !important; }
  .principal { margin-left: 0 !important; }
  body { background: #fff; color: #000; }
  .page { max-width: none; padding: 0; }
  .entete { margin-top: 0; }
  .bloc { break-inside: avoid; }
}


/* Logo : l'icône de l'appli */
.logo { background: none; box-shadow: none; overflow: hidden; }
.logo img { display: block; width: 100%; height: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(30, 30, 80, .3); }


/* =====================================================
   Version 6 : nouveautés (images, sous-tâches, tableau, calendrier,
   modèles, recherche globale, palettes, polices, mode compact)

/* ---------- Palettes ---------- */
:root[data-palette="ardoise"] { --fond: #f5f7fa; --lateral: #edf1f6; --ligne: #dfe5ed; --survol: #e7ecf3; --texte: #172033; --discret: #66748a; }
:root[data-palette="chaud"]   { --fond: #fbf8f3; --carte: #fffdf9; --lateral: #f4efe6; --ligne: #e8dfd0; --survol: #eee6d8; --texte: #2b2219; --discret: #85796a; }
@media (prefers-color-scheme: dark) {
  :root[data-palette="ardoise"]:not([data-theme="clair"]) { --fond: #0d1117; --carte: #151b24; --lateral: #10151c; --ligne: #232c38; --survol: #1b2330; --texte: #e6edf6; --discret: #8793a6; }
  :root[data-palette="chaud"]:not([data-theme="clair"])   { --fond: #17130f; --carte: #1f1a14; --lateral: #1b1712; --ligne: #332b22; --survol: #29221a; --texte: #f1e9dd; --discret: #a09584; }
  :root[data-palette="noir"]:not([data-theme="clair"])    { --fond: #000; --carte: #0b0b0d; --lateral: #050506; --ligne: #1c1c21; --survol: #131316; }
}
:root[data-palette="ardoise"][data-theme="sombre"] { --fond: #0d1117; --carte: #151b24; --lateral: #10151c; --ligne: #232c38; --survol: #1b2330; --texte: #e6edf6; --discret: #8793a6; }
:root[data-palette="chaud"][data-theme="sombre"]   { --fond: #17130f; --carte: #1f1a14; --lateral: #1b1712; --ligne: #332b22; --survol: #29221a; --texte: #f1e9dd; --discret: #a09584; }
:root[data-palette="noir"][data-theme="sombre"]    { --fond: #000; --carte: #0b0b0d; --lateral: #050506; --ligne: #1c1c21; --survol: #131316; }

/* ---------- Polices ---------- */
:root[data-police="arrondie"] { --police: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", "Varela Round", system-ui, sans-serif; }

button, input, select, textarea { font-family: inherit; }

/* ---------- Mode compact ---------- */
body.compact .bloc { min-height: 34px; }

/* ---------- Blocs image ---------- */
.bloc-image .contenu { flex-direction: column; align-items: stretch; gap: 0; }
.bloc-image .corps { width: 100%; }
.figure { margin: 6px 0 0; }
.figure-image { display: block; width: 100%; padding: 0; border: 0; border-radius: 12px; background: var(--survol); overflow: hidden; cursor: zoom-in; box-shadow: 0 0 0 1px var(--ligne), var(--ombre-douce); transition: transform .3s var(--fluide), box-shadow .3s; }

.figure-vide { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 96px; border: 1.5px dashed var(--ligne); border-radius: 12px; background: none; color: var(--discret); font-size: .95rem; transition: border-color .2s, color .2s, background .2s; }
.figure-vide:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--ligne)); color: var(--texte); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.bloc-image .texte { font-size: .88rem; color: var(--discret); text-align: center; padding: 6px 0 8px; }

.chip.progression { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--discret) 12%, transparent); color: var(--texte); }

.mini-barre i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent); transition: width .5s var(--fluide); }
.chip.progression.complet .mini-barre i { background: var(--ok); }
.chip.encours { background: color-mix(in srgb, var(--attention) 15%, transparent); color: var(--attention); }

/* ---------- Tableau (Kanban) ---------- */
.tableau { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; margin-top: 8px; }
.colonne { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; background: var(--survol); min-height: 120px; }

.colonne-compte { padding: 1px 8px; border-radius: 99px; background: var(--carte); font-size: .78rem; font-weight: 600; color: var(--discret); font-variant-numeric: tabular-nums; }
.colonne[data-colonne="encours"] { background: color-mix(in srgb, var(--attention) 8%, var(--survol)); }
.colonne[data-colonne="fait"] { background: color-mix(in srgb, var(--ok) 6%, var(--survol)); }
.colonne-vide { margin: 4px 2px; color: var(--discret); font-size: .85rem; }
.carte-tache { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--carte); box-shadow: 0 0 0 1px var(--ligne), var(--ombre-douce); animation: bloc-entre .35s var(--fluide) both; transition: transform .25s var(--fluide), box-shadow .25s; }
@media (hover: hover) { .carte-tache:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--ligne), var(--ombre); } }
.carte-tache.fait .carte-texte { color: var(--discret); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--discret) 70%, transparent); }
.carte-texte { padding: 0; border: 0; background: none; text-align: left; font-weight: 550; line-height: 1.4; overflow-wrap: anywhere; }
.etats { display: flex; gap: 4px; padding: 3px; border-radius: 9px; background: var(--survol); align-self: flex-start; }
.etat { width: 34px; height: 28px; border: 0; border-radius: 7px; background: none; font-size: .95rem; opacity: .55; transition: background .2s, opacity .2s, transform .25s var(--ressort); }

.calendrier { margin-top: 8px; }
.cal-entete { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-entete .cal-titre { flex: 1; margin: 0; font-size: 1.15rem; font-weight: 650; text-transform: capitalize; letter-spacing: -.01em; }

.jour:active { transform: scale(.93); }
@media (hover: hover) { button.jour:hover { background: var(--survol); } }
.jour-num { font-size: .92rem; font-weight: 550; font-variant-numeric: tabular-nums; }
.jour.aujourdhui .jour-num { display: grid; place-items: center; min-width: 26px; height: 26px; margin-top: -2px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; }

.jour.toutes-faites .jour-points i { background: var(--ok); opacity: .7; }

/* ---------- Modèles de pages ---------- */
.modeles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.modele { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border: 1px solid var(--ligne); border-radius: 12px; background: var(--carte); color: inherit; text-align: left; transition: border-color .2s, transform .25s var(--ressort), background .15s; }
.modele:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--ligne)); transform: translateY(-1px); }
.modele:active { transform: scale(.98); }
.modele-icone { display: grid; place-items: center; width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; background: var(--survol); font-size: 1.25rem; }

/* ---------- Résultats de la recherche globale ---------- */

/* ---------- Accueil ---------- */
.astuces { display: flex; flex-direction: column; gap: 10px; margin: 0 0 16px; padding: 0; list-style: none; }

.titre-champ { display: block; margin: 6px 0 -2px; font-size: .82rem; font-weight: 600; color: var(--discret); }

.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
.kpi { background: var(--survol); border-radius: var(--rayon); padding: 14px; display: flex; flex-direction: column; gap: 2px; }

.ligne-progression { display: grid; grid-template-columns: 1fr 90px auto; align-items: center; gap: 10px; padding: 5px 0; }
.ligne-progression .lp-nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ligne-progression small { color: var(--discret); font-variant-numeric: tabular-nums; }

  <script>
"use strict";

/* =====================================================
   store.js : les données de l'appli
   Une appli = plusieurs pages. Une page = une liste de blocs.
   ===================================================== */

// Espace de noms partagé par tous les fichiers
const App = {};

App.CLE = "gestionnaire-blocs-v2";   // même clé qu'avant : tes données restent
App.ANCIENNE_CLE = "gestionnaire-blocs-v1";

App.COULEURS_PAGE = ["violet", "bleu", "vert", "orange", "rose", "turquoise"];
App.COULEURS_BLOC = ["jaune", "vert", "bleu", "rose", "violet"];
App.ICONES = ["📝", "📚", "💡", "🎯", "🏠", "💼", "🎓", "🛒", "🎮", "🚀"];
App.REPETITIONS = { "": "Jamais", jour: "Chaque jour", semaine: "Chaque semaine", mois: "Chaque mois" };

// Tous les types de blocs disponibles (menu "/" et menu du bloc)
App.TYPES = {
  paragraphe: { nom: "Texte", icone: "¶", aide: "Du texte simple", cles: ["texte", "paragraphe", "text"], placeholder: "Écris, ou tape « / » pour les blocs" },
  titre: { nom: "Titre 1", icone: "H1", aide: "Un grand titre", cles: ["titre", "h1", "heading"], placeholder: "Titre 1" },
  sous_titre: { nom: "Titre 2", icone: "H2", aide: "Un titre de section", cles: ["titre", "sous", "h2"], placeholder: "Titre 2" },
  tache: { nom: "Tâche", icone: "☑", aide: "Avec une case à cocher", cles: ["tache", "todo", "cocher", "checkbox"], placeholder: "À faire…" },
  liste: { nom: "Liste à puces", icone: "•", aide: "Une liste simple", cles: ["liste", "puces", "bullet"], placeholder: "Élément de liste" },
  numerotee: { nom: "Liste numérotée", icone: "1.", aide: "Une liste ordonnée", cles: ["liste", "numero", "numerotee", "number"], placeholder: "Élément numéroté" },
  citation: { nom: "Citation", icone: "❝", aide: "Pour mettre une idée en avant", cles: ["citation", "quote"], placeholder: "Citation…" },
  image: { nom: "Image", icone: "🖼", aide: "Une photo ou une capture d'écran", cles: ["image", "photo", "img", "capture"], placeholder: "Ajouter une légende…" },
  separateur: { nom: "Séparateur", icone: "—", aide: "Une ligne de séparation", cles: ["separateur", "ligne", "divider", "hr"], placeholder: "" },
};

// Ces types gardent leur forme quand on appuie sur Entrée
App.TYPES_LISTE = ["tache", "liste", "numerotee"];


/* ---------- Dates (en heure locale, format AAAA-MM-JJ) ---------- */

App.iso = function (date) {
  const z = (n) => String(n).padStart(2, "0");
  return date.getFullYear() + "-" + z(date.getMonth() + 1) + "-" + z(date.getDate());
};
App.aujourdhui = function () { return App.iso(new Date()); };


/* ---------- Texte enrichi : on ne garde que gras, italique, etc. ---------- */

// Nettoie un morceau de HTML : seules quelques balises sûres sont conservées
App.assainir = function (html) {
  const modele = document.createElement("template"); // contenu inerte : rien ne s'exécute
  modele.innerHTML = html;
  const AUTORISES = { B: "b", STRONG: "b", I: "i", EM: "i", U: "u", S: "s", STRIKE: "s", DEL: "s", CODE: "code", A: "a" };

  function copier(source, destination) {
    source.childNodes.forEach((n) => {
      if (n.nodeType === 3) {
        destination.append(document.createTextNode(n.nodeValue));
      } else if (n.nodeType === 1) {
        const balise = AUTORISES[n.tagName];
        if (n.tagName === "BR" || n.tagName === "SCRIPT" || n.tagName === "STYLE") return;
        if (!balise) { copier(n, destination); return; }
        const el = document.createElement(balise);
        if (balise === "a") {
          const lien = n.getAttribute("href") || "";
          if (!/^(https?:|mailto:)/i.test(lien)) { copier(n, destination); return; }
          el.setAttribute("href", lien);
          el.setAttribute("target", "_blank");
          el.setAttribute("rel", "noopener noreferrer");
        }
        copier(n, el);
        destination.append(el);
      }
    });
  }
  const sortie = document.createElement("div");
  copier(modele.content, sortie);
  // Retire les balises de mise en forme vides éventuellement laissées après un découpage
  sortie.querySelectorAll("b,i,u,s,code,a").forEach((el) => {
    if (!el.textContent) el.remove();
  });
  return sortie.innerHTML;
};

App.nettoyerTag = function (tag) {
  return String(tag).toLowerCase().trim().replace(/^#/, "").replace(/\s+/g, "-").replace(/[^\p{L}\p{N}_-]/gu, "").slice(0, 24);
};


/* ---------- Fabriques ---------- */

App.id = function () {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
};

App.nouveauBloc = function (type, texte) {
  const bloc = {
    id: App.id(), type: type || "paragraphe", texte: texte || "", html: "", niveau: 0, couleur: "",
    echeance: "", heure: "", tags: [], repete: "", replie: false, rappele: "",
    creeLe: Date.now(), faitLe: 0,
  };
  if (bloc.type === "tache") { bloc.fait = false; bloc.encours = false; }
  if (bloc.type === "image") bloc.src = "";
  return bloc;
};

App.nouvellePage = function (titre, couleur, icone) {
  return {
    id: App.id(),
    titre: titre || "",
    icone: icone || "📝",
    couleur: couleur || "violet",
    maj: Date.now(),
    blocs: [App.nouveauBloc("paragraphe")],
  };
};


/* ---------- Pages d'exemple (premier lancement) ---------- */

App.demo = function () {
  const aujourdhui = App.aujourdhui();
  const demain = new Date(); demain.setDate(demain.getDate() + 1);
  const b = (type, texte, extra) => Object.assign(App.nouveauBloc(type, texte), extra || {});

  const accueil = {
    id: App.id(), titre: "Bienvenue", icone: "👋", couleur: "violet", maj: Date.now(),
    blocs: [
      b("paragraphe", "Chaque ligne est un bloc. Appuie sur Entrée pour en créer un, ou tape « / » pour choisir son type."),
      b("sous_titre", "Essaie ces gestes"),
      b("tache", "Cocher cette tâche (regarde la barre de progression)"),
      b("tache", "Taper « / » pour changer le type d'un bloc"),
      b("tache", "Décaler un bloc avec Tab (ou le menu ⋮⋮)", { niveau: 1 }),
      b("tache", "Glisser un bloc avec les points ⋮⋮ à gauche"),
      b("tache", "Replier ce bloc avec la flèche à gauche", { replie: false }),
      b("tache", "Un détail caché dans le bloc replié", { niveau: 1 }),
      b("tache", "Écrire une tâche avec une date limite (bouton 📅)", { echeance: aujourdhui, tags: ["demo"] }),
      b("tache", "Une tâche qui se répète chaque semaine", { echeance: App.iso(demain), repete: "semaine", tags: ["demo"] }),
      b("citation", "Astuce : « - », « [] », « # », « > » et « 1. » en début de ligne créent des blocs. Sélectionne du texte pour le mettre en gras ou en italique."),
      b("separateur", ""),
      b("liste", "Tout est sauvegardé automatiquement sur ton appareil"),
      b("liste", "Ctrl + Z annule, et la corbeille garde 30 jours"),
    ],
  };

  const projets = {
    id: App.id(), titre: "Mes projets", icone: "🚀", couleur: "bleu", maj: Date.now(),
    blocs: [
      b("tache", "Finir mon gestionnaire de blocs", { fait: true }),
      b("tache", "Le publier sur GitHub Pages", { tags: ["projet"] }),
      b("tache", "L'installer sur mon téléphone", { tags: ["projet"] }),
    ],
  };

  return App.normaliser({ pages: [accueil, projets], courante: accueil.id });
};


/* ---------- Vérification des données (anciennes versions, import…) ---------- */

function normBloc(bloc) {
  bloc.id = bloc.id || App.id();
  if (!App.TYPES[bloc.type]) bloc.type = "paragraphe";
  bloc.texte = typeof bloc.texte === "string" ? bloc.texte : "";
  bloc.niveau = Math.max(0, Math.min(3, Number(bloc.niveau) || 0));
  if (!App.COULEURS_BLOC.includes(bloc.couleur)) bloc.couleur = "";
  if (bloc.type === "tache") {
    bloc.fait = !!bloc.fait;
    bloc.encours = !bloc.fait && bloc.encours === true;     // statut « en cours » (vue Tableau)
  } else { delete bloc.fait; delete bloc.encours; }
  bloc.creeLe = Number(bloc.creeLe) > 0 ? Number(bloc.creeLe) : 0;
  bloc.faitLe = bloc.fait && Number(bloc.faitLe) > 0 ? Number(bloc.faitLe) : 0;
  if (bloc.type === "image") {
    // l'image est stockée dans IndexedDB ("idb:...") ou en Data URL ; on refuse tout ce qui n'est pas valide
    const okData = typeof bloc.src === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(bloc.src);
    const okIdb = typeof bloc.src === "string" && /^idb:[A-Za-z0-9_-]+$/.test(bloc.src);
    bloc.src = (okData || okIdb) ? bloc.src : "";
  } else delete bloc.src;
  bloc.echeance = /^\d{4}-\d{2}-\d{2}$/.test(bloc.echeance) ? bloc.echeance : "";
  bloc.heure = /^\d{2}:\d{2}$/.test(bloc.heure) ? bloc.heure : "";
  bloc.tags = Array.isArray(bloc.tags) ? [...new Set(bloc.tags.map(App.nettoyerTag).filter(Boolean))].slice(0, 8) : [];
  bloc.repete = Object.prototype.hasOwnProperty.call(App.REPETITIONS, bloc.repete) ? bloc.repete : "";
  bloc.replie = !!bloc.replie;
  bloc.rappele = typeof bloc.rappele === "string" ? bloc.rappele : "";
  // Texte enrichi : on le garde seulement s'il correspond bien au texte brut
  let html = typeof bloc.html === "string" && bloc.html ? App.assainir(bloc.html) : "";
  if (html) {
    const essai = document.createElement("div");
    essai.innerHTML = html;
    if (essai.textContent.replace(/\u00a0/g, " ") !== bloc.texte.replace(/\u00a0/g, " ")) html = "";
  }
  bloc.html = html;
  return bloc;
}

function normPage(p) {
  p.id = p.id || App.id();
  p.titre = typeof p.titre === "string" ? p.titre : "";
  p.icone = p.icone || "📝";
  if (!App.COULEURS_PAGE.includes(p.couleur)) p.couleur = "violet";
  p.favori = p.favori === true;
  p.maj = Number(p.maj) || Date.now();
  if (!Array.isArray(p.blocs) || p.blocs.length === 0) p.blocs = [App.nouveauBloc("paragraphe")];
  p.blocs.forEach(normBloc);
  return p;
}

App.normaliser = function (etat) {
  etat = etat || {};
  const pages = (Array.isArray(etat.pages) ? etat.pages : []).filter((p) => p && typeof p === "object").map(normPage);
  const stats = { faits: {}, pomodoros: {} };
  ["faits", "pomodoros"].forEach((t) => {
    const source = etat.stats && etat.stats[t];
    if (source && typeof source === "object") {
      Object.keys(source).forEach((jour) => {
        if (/^\d{4}-\d{2}-\d{2}$/.test(jour) && Number(source[jour]) > 0) stats[t][jour] = Math.floor(Number(source[jour]));
      });
    }
  });
  const supprimees = {};
  if (etat.supprimees && typeof etat.supprimees === "object") {
    Object.keys(etat.supprimees).forEach((id) => { if (Number(etat.supprimees[id])) supprimees[id] = Number(etat.supprimees[id]); });
  }
  const corbeille = (Array.isArray(etat.corbeille) ? etat.corbeille : [])
    .filter((e) => e && e.id && (e.kind === "page" || e.kind === "bloc") && e.data)
    .map((e) => {
      if (e.kind === "page") e.data = normPage(e.data);
      else e.data = (Array.isArray(e.data) ? e.data : [e.data]).map(normBloc);
      e.date = Number(e.date) || Date.now();
      return e;
    });

  const reglages = Object.assign({ rappels: false, animations: true, palette: "neutre", police: "systeme", compact: false }, etat.reglages && typeof etat.reglages === "object" ? etat.reglages : {});
  reglages.rappels = !!reglages.rappels;
  if (!["neutre", "ardoise", "chaud", "noir"].includes(reglages.palette)) reglages.palette = "neutre";
  if (!["systeme", "arrondie", "serif", "mono"].includes(reglages.police)) reglages.police = "systeme";
  reglages.compact = reglages.compact === true;
  reglages.animations = reglages.animations !== false;

  if (pages.length === 0) {
    if (etat.__sansDemo) return { pages: [], courante: "", theme: "auto", corbeille, supprimees, stats, reglages };
    const d = App.demo();
    d.stats = stats; d.corbeille = corbeille; d.supprimees = supprimees; d.reglages = reglages;
    return d;
  }
  return {
    pages,
    courante: pages.some((p) => p.id === etat.courante) ? etat.courante : pages[0].id,
    theme: ["auto", "clair", "sombre"].includes(etat.theme) ? etat.theme : "auto",
    corbeille, supprimees, stats, reglages,
  };
};


/* ---------- Fusion de deux versions (import, synchronisation) ----------
   Pour chaque page, la plus récemment modifiée gagne.
   Une page supprimée plus récemment que sa dernière modification reste supprimée. */

App.fusionner = function (local, distant) {
  const pages = new Map();
  local.pages.forEach((p) => pages.set(p.id, p));
  distant.pages.forEach((p) => {
    const l = pages.get(p.id);
    if (!l || p.maj > l.maj) pages.set(p.id, p);
  });

  const supprimees = Object.assign({}, distant.supprimees);
  Object.keys(local.supprimees).forEach((id) => { supprimees[id] = Math.max(supprimees[id] || 0, local.supprimees[id]); });
  [...pages.keys()].forEach((id) => {
    if (!supprimees[id]) return;
    if (supprimees[id] > pages.get(id).maj) pages.delete(id);
    else delete supprimees[id]; // restaurée depuis : on oublie la suppression
  });

  const stats = { faits: {}, pomodoros: {} };
  ["faits", "pomodoros"].forEach((t) => {
    [local.stats[t], distant.stats[t]].forEach((s) => {
      Object.keys(s).forEach((j) => { stats[t][j] = Math.max(stats[t][j] || 0, s[j]); });
    });
  });

  const vus = new Set();
  const corbeille = [...local.corbeille, ...distant.corbeille]
    .filter((e) => (vus.has(e.id) ? false : vus.add(e.id)))
    .sort((a, b) => b.date - a.date)
    .slice(0, 100);

  const liste = [...pages.values()];
  return {
    pages: liste.length ? liste : [App.nouvellePage()],
    courante: local.courante, theme: local.theme, reglages: local.reglages,
    corbeille, supprimees, stats,
  };
};


/* ---------- Chargement et sauvegarde ---------- */

function charger() {
  try {
    const brut = localStorage.getItem(App.CLE);
    if (brut) return App.normaliser(JSON.parse(brut));

    // Migration : on récupère la page de la version 1 si elle existe
    const ancien = localStorage.getItem(App.ANCIENNE_CLE);
    if (ancien) {
      const v1 = JSON.parse(ancien);
      return App.normaliser({ pages: [{ titre: v1.titre, blocs: v1.blocs }] });
    }
  } catch (erreur) {
    // données absentes ou abîmées : on repart des pages d'exemple
  }
  return App.demo();
}

/* ---------- Stockage des images dans IndexedDB ----------
   Évite de saturer le quota de localStorage (5-10 Mo) avec des photos Base64. */
App.ImagesDB = (function () {
  const NOM_DB = "focusflow-medias";
  const STORE = "images";
  const cache = new Map();
  let dbPromise = null;
  let initPromise = null;

  const estRef = (src) => typeof src === "string" && /^idb:[A-Za-z0-9_-]+$/.test(src);

  function ouvrir() {
    if (dbPromise) return dbPromise;
    if (!("indexedDB" in window)) return Promise.resolve(null);
    dbPromise = new Promise((resolve) => {
      try {
        const req = indexedDB.open(NOM_DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "id" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
      } catch (e) {
        resolve(null);
      }
    });
    return dbPromise;
  }

  async function enregistrer(dataUrl) {
    if (!dataUrl || estRef(dataUrl)) return dataUrl || "";
    const ref = "idb:" + App.id();
    cache.set(ref, dataUrl);
    const db = await ouvrir();
    if (!db) return dataUrl; // repli en Data URL si IndexedDB indisponible
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put({ id: ref, data: dataUrl, maj: Date.now() });
        tx.oncomplete = () => resolve(ref);
        tx.onerror = () => resolve(dataUrl);
      } catch (e) {
        resolve(dataUrl);
      }
    });
  }

  async function obtenir(src) {
    if (!src) return "";
    if (!estRef(src)) return src;
    if (cache.has(src)) return cache.get(src);
    const db = await ouvrir();
    if (!db) return "";
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).get(src);
        req.onsuccess = () => {
          const data = req.result && req.result.data ? req.result.data : "";
          if (data) cache.set(src, data);
          resolve(data);
        };
        req.onerror = () => resolve("");
      } catch (e) {
        resolve("");
      }
    });
  }

  function obtenirSync(src) {
    if (!src) return "";
    if (!estRef(src)) return src;
    return cache.get(src) || "";
  }

  function actualiserDom() {
    document.querySelectorAll("img[data-idb-ref]").forEach((img) => {
      const ref = img.dataset.idbRef;
      const data = cache.get(ref);
      if (data && img.src !== data) img.src = data;
    });
  }

  async function prechargerTout() {
    const db = await ouvrir();
    if (!db) return;
    await new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE, "readonly");
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => {
          (req.result || []).forEach((item) => {
            if (item && item.id && item.data) cache.set(item.id, item.data);
          });
          actualiserDom();
          resolve();
        };
        req.onerror = () => resolve();
      } catch (e) {
        resolve();
      }
    });
  }

  function listerBlocsEtat(etat) {
    const liste = [];
    if (!etat) return liste;
    (etat.pages || []).forEach((p) => (p.blocs || []).forEach((b) => liste.push(b)));
    (etat.corbeille || []).forEach((e) => {
      if (e.kind === "page" && e.data && Array.isArray(e.data.blocs)) e.data.blocs.forEach((b) => liste.push(b));
      else if (e.kind === "bloc" && Array.isArray(e.data)) e.data.forEach((b) => liste.push(b));
    });
    return liste;
  }

  async function migrerEtat(etat, preserverMaj) {
    if (!etat) return false;
    let modifie = false;
    for (const b of listerBlocsEtat(etat)) {
      if (b && b.type === "image" && typeof b.src === "string" && b.src.startsWith("data:image/")) {
        const ref = await enregistrer(b.src);
        if (ref !== b.src) {
          b.src = ref;
          modifie = true;
        }
      }
    }
    if (modifie && etat === App.etat) {
      const ancienSansMaj = App._sansMaj;
      if (preserverMaj) App._sansMaj = true;
      App.sauver();
      if (preserverMaj) {
        App._sansMaj = ancienSansMaj;
        App.initEmpreintes();
      }
      actualiserDom();
    }
    return modifie;
  }

  async function nettoyerOrphelines() {
    const db = await ouvrir();
    if (!db || !App.etat || !Array.isArray(App.etat.pages) || App.etat.pages.length === 0) return;
    const actives = new Set();
    listerBlocsEtat(App.etat).forEach((b) => {
      if (b && b.type === "image" && estRef(b.src)) actives.add(b.src);
    });
    await new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE, "readwrite");
        const store = tx.objectStore(STORE);
        const req = store.getAllKeys();
        req.onsuccess = () => {
          (req.result || []).forEach((cle) => {
            if (!actives.has(cle)) {
              store.delete(cle);
              cache.delete(cle);
            }
          });
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      } catch (e) {
        resolve();
      }
    });
  }

  function initialiser() {
    if (initPromise) return initPromise;
    initPromise = (async () => {
      await prechargerTout();
      await migrerEtat(App.etat, true);
      await nettoyerOrphelines();
    })();
    return initPromise;
  }

  return {
    estRef,
    enregistrer,
    obtenir,
    obtenirSync,
    migrerEtat,
    initialiser,
    pret: () => initialiser(),
  };
})();

App.etat = charger();
App.ImagesDB.initialiser();

App._empreintes = {};
App._sansMaj = false;    // vrai pendant qu'on applique des données venues d'ailleurs

App.empreinte = function (p) { return JSON.stringify([p.titre, p.icone, p.couleur, p.favori === true, p.blocs]); };

  App.etat.pages.forEach((p) => {
    const e = App.empreinte(p);
    if (App._empreintes[p.id] !== e) {

    if (erreur && (erreur.name === "QuotaExceededError" || erreur.code === 22) && App.Toast && !App._avertiPlein) {

  App.etat.corbeille = App.etat.corbeille.filter((e) => e.date > limite).slice(0, 100);

  const cx = rect.left + Math.min(rect.width, 40) / 2;
  const cy = rect.top + rect.height / 2;
  const couleurs = ["#7c5cff", "#4ea1ff", "#3ecf8e", "#f7c948", "#ff6b9d", "#ff7a1a"];

    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance + 20;

        { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(.4) rotate(" + Math.round(Math.random() * 360) + "deg)", opacity: 0 },

// Crée un élément en une ligne : App.el("button", { class: "x", onclick: f }, "Texte")
App.el = function (balise, props, ...enfants) {
  const e = document.createElement(balise);
  Object.keys(props || {}).forEach((k) => {
    const v = props[k];
    if (v === false || v == null) return;
    if (k === "class") e.className = v;
    else if (k === "texte") e.textContent = v;
    else if (k === "value" || k === "checked" || k === "disabled" || k === "hidden") e[k] = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  });
  enfants.flat().forEach((c) => {
    if (c == null || c === false) return;
    e.append(c.nodeType ? c : document.createTextNode(c));
  });
  return e;
};

App.Feuille = (function () {

App.Invite = (function () {

/* ---------- Dates ---------- */

const dateDe = (iso) => new Date(iso + "T00:00:00");

App.ajouterJours = function (iso, n) {
  const d = dateDe(iso);
  d.setDate(d.getDate() + n);
  return App.iso(d);
};

App.ajouterMois = function (iso, n) {
  const d = dateDe(iso);
  const jour = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  const dernier = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(jour, dernier));
  return App.iso(d);
};

// Écart en jours entre une date et aujourd'hui (négatif = passé)
App.ecartJours = function (iso) {
  return Math.round((dateDe(iso) - dateDe(App.aujourdhui())) / 864e5);
};

App.etiquetteDate = function (iso, heure) {
  const ecart = App.ecartJours(iso);
  let texte;
  if (ecart === 0) texte = "Aujourd'hui";
  else if (ecart === 1) texte = "Demain";
  else if (ecart === -1) texte = "Hier";
  else {
    const options = { weekday: "short", day: "numeric", month: "short" };
    if (dateDe(iso).getFullYear() !== new Date().getFullYear()) options.year = "numeric";
    texte = dateDe(iso).toLocaleDateString("fr-FR", options);
  }
  return heure ? texte + " " + heure : texte;
};

App.statutDate = function (bloc) {
  if (bloc.type !== "tache" || !bloc.echeance || bloc.fait) return "";
  const ecart = App.ecartJours(bloc.echeance);
  return ecart < 0 ? "retard" : ecart === 0 ? "aujourdhui" : "avenir";
};

App.prochaineEcheance = function (iso, repete) {
  const pas = (d) => (repete === "jour" ? App.ajouterJours(d, 1) : repete === "semaine" ? App.ajouterJours(d, 7) : App.ajouterMois(d, 1));
  let suivante = pas(iso);
  for (let i = 0; i < 400 && App.ecartJours(suivante) < 0; i++) suivante = pas(suivante);
  return suivante;
};

// Toutes les tâches de toutes les pages, avec leur page
App.toutesLesTaches = function () {

  App.etat.pages.forEach((page) => {

App.telecharger = function (nom, contenu, type) {

/* =====================================================
   histoire.js : annuler (Ctrl+Z) et rétablir (Ctrl+Y)
   On garde des « photos » successives des pages.
   ===================================================== */

App.Histoire = (function () {
  const MAX = 100;
  let pile = [];        // photos passées
  let futur = [];       // photos annulées (pour rétablir)
  let minuteur = null;
  let bloque = false;   // vrai pendant qu'on restaure une photo

  // La date de modification ("maj") n'est pas comparée : annuler ne doit pas créer une nouvelle photo
  const photo = () => JSON.stringify({ pages: App.etat.pages, courante: App.etat.courante }, (cle, valeur) => (cle === "maj" ? undefined : valeur));
  let courant = photo();

  function majBoutons() {
    document.querySelectorAll("[data-action='annuler']").forEach((b) => { b.disabled = pile.length === 0; });
    document.querySelectorAll("[data-action='retablir']").forEach((b) => { b.disabled = futur.length === 0; });
  }

  // Enregistre une nouvelle photo si quelque chose a changé
  function noter() {
    if (bloque) return;
    clearTimeout(minuteur);
    const s = photo();
    if (s === courant) return;
    pile.push(courant);
    if (pile.length > MAX) pile.shift();
    courant = s;
    futur = [];
    majBoutons();
  }

  // Pendant la frappe, on attend une pause pour ne pas faire une photo par lettre
  function differe() {
    if (bloque) return;
    clearTimeout(minuteur);
    minuteur = setTimeout(noter, 600);
  }

  function restaurer(instantane) {
    const donnees = JSON.parse(instantane);
    const avant = new Set(App.etat.pages.map((p) => p.id));
    const n = App.normaliser({ pages: donnees.pages, courante: donnees.courante, __sansDemo: true });
    const apres = new Set(n.pages.map((p) => p.id));

    // Les pages qui disparaissent (ou reviennent) sont notées pour la synchronisation
    avant.forEach((id) => { if (!apres.has(id)) App.etat.supprimees[id] = Date.now(); });
    apres.forEach((id) => { if (!avant.has(id)) delete App.etat.supprimees[id]; });

    bloque = true;
    App.etat.pages = n.pages.length ? n.pages : [App.nouvellePage()];
    App.etat.courante = App.etat.pages.some((p) => p.id === n.courante) ? n.courante : App.etat.pages[0].id;
    App.sauver();
    App.ouvrirPage(App.etat.courante, false);
    bloque = false;
    majBoutons();
  }

  function annuler() {
    noter();
    if (!pile.length) { App.Toast.afficher("Rien à annuler"); return; }
    futur.push(courant);
    courant = pile.pop();
    restaurer(courant);
  }

  function retablir() {
    noter();
    if (!futur.length) { App.Toast.afficher("Rien à rétablir"); return; }
    pile.push(courant);
    courant = futur.pop();
    restaurer(courant);
  }

  App.ecouteurs.push(differe);

  // Raccourcis clavier (sauf dans les champs de formulaire, qui ont leur propre annulation)
  document.addEventListener("keydown", (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const cible = e.target;
    if (cible && /^(INPUT|TEXTAREA|SELECT)$/.test(cible.tagName)) return;
    if (document.querySelector("dialog[open]")) return;
    const touche = e.key.toLowerCase();
    if (touche === "z") { e.preventDefault(); e.shiftKey ? retablir() : annuler(); }
    else if (touche === "y") { e.preventDefault(); retablir(); }
  });

  document.addEventListener("click", (e) => {
    const bouton = e.target.closest("[data-action]");
    if (!bouton) return;
    if (bouton.dataset.action === "annuler") annuler();
    if (bouton.dataset.action === "retablir") retablir();
  });

  return { annuler, retablir, noter, majBoutons };
})();
