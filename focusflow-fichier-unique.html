    [/^#[ \u00a0]/, "titre"],
    [/^##[ \u00a0]/, "sous_titre"],
    [/^(\[\]|\[[ \u00a0]\])[ \u00a0]/, "tache"],
    [/^[-*][ \u00a0]/, "liste"],
    [/^1\.[ \u00a0]/, "numerotee"],
    [/^>[ \u00a0]/, "citation"],
  ];

  const blocs = () => App.page().blocs;
  const index = (id) => blocs().findIndex((b) => b.id === id);
  const lire = (zone) => zone.textContent.replace(/\u00a0/g, " ");

  // Fin (exclue) du groupe formé par un bloc et tous les blocs décalés sous lui
  function finSousArbre(i) {
    const bl = blocs();
    let j = i + 1;
    while (j < bl.length && bl[j].niveau > bl[i].niveau) j++;
    return j;
  }

  function changerType(bloc, type) {
    bloc.type = type;
    if (type === "tache") bloc.fait = !!bloc.fait;
    else delete bloc.fait;
    if (type === "separateur") { bloc.texte = ""; bloc.html = ""; }
    if (type === "image") { bloc.src = bloc.src || ""; bloc.html = ""; }
    else delete bloc.src;
    if (type !== "tache") delete bloc.encours;
  }

  // Un bloc image sans photo ouvre aussitôt le sélecteur de fichier
  function apresType(bloc) {
    if (bloc.type === "image" && !bloc.src) setTimeout(() => App.choisirImage(bloc.id), 60);
  }

  // Insère après un bloc (et après ses blocs cachés s'il est replié)
  function insererApres(id, bloc) {
    const bl = blocs();
    const i = index(id);
    if (i === -1) bl.push(bloc);
    else bl.splice(bl[i].replie ? finSousArbre(i) : i + 1, 0, bloc);
  }

  // Bloc visible voisin (les blocs repliés ne sont pas dans la page)
  function voisin(id, delta) {
    const lignes = [...conteneur.querySelectorAll(".bloc")];
    const i = lignes.findIndex((l) => l.dataset.id === id);
    const ligne = lignes[i + delta];
    return ligne ? blocs().find((b) => b.id === ligne.dataset.id) : undefined;
  }


  /* ---------- Affichage ---------- */

  // Construit la page. enregistrer = false : on redessine seulement (recherche).
  function rendu(idFocus, position, idAnime, enregistrer) {
    const bl = blocs();
    const compteurs = {};
    const lignes = [];
    let masque = null; // niveau du bloc replié qui cache les blocs suivants

    bl.forEach((bloc, i) => {
      let numero = 0;
      if (bloc.type === "numerotee") {
        compteurs[bloc.niveau] = (compteurs[bloc.niveau] || 0) + 1;
        numero = compteurs[bloc.niveau];
        Object.keys(compteurs).forEach((n) => { if (+n > bloc.niveau) delete compteurs[n]; });
      } else {
        Object.keys(compteurs).forEach((n) => { if (+n >= bloc.niveau) delete compteurs[n]; });
      }

      if (masque !== null && !filtreRecherche) {
        if (bloc.niveau > masque) return;
        masque = null;
      }
      const aEnfants = !!bl[i + 1] && bl[i + 1].niveau > bloc.niveau;
      lignes.push(creerLigne(bloc, numero, bloc.id === idAnime, aEnfants));
      if (bloc.replie && aEnfants) masque = bloc.niveau;
    });

    conteneur.replaceChildren(...lignes);
    if (enregistrer) App.sauver();
    App.majProgres(false);
    appliquerRecherche();
    if (idFocus) focaliser(idFocus, position);
  }

  function afficher(idFocus, position, idAnime) { rendu(idFocus, position, idAnime, true); }
  App.afficherBlocs = afficher;

  function creerLigne(bloc, numero, anime, aEnfants) {
    const ligne = document.createElement("div");
    ligne.className = "bloc bloc-" + bloc.type;
    ligne.dataset.id = bloc.id;
    ligne.dataset.niveau = bloc.niveau;
    ligne.style.setProperty("--niveau", bloc.niveau);
    if (bloc.couleur) ligne.dataset.teinte = bloc.couleur;
    if (bloc.fait) ligne.classList.add("fait");
    if (anime && !App.mouvementReduit()) ligne.classList.add("entree");

    // Poignée : glisser pour déplacer, toucher pour ouvrir les options
    const poignee = document.createElement("button");
    poignee.type = "button";
    poignee.className = "poignee";
    poignee.innerHTML = '<svg viewBox="0 0 10 16" aria-hidden="true"><circle cx="2.5" cy="3" r="1.5"/><circle cx="7.5" cy="3" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/><circle cx="2.5" cy="13" r="1.5"/><circle cx="7.5" cy="13" r="1.5"/></svg>';
    poignee.setAttribute("aria-label", "Options du bloc (glisser pour déplacer)");
    poignee.addEventListener("pointerdown", (e) => glisser(e, bloc.id, ligne, poignee));
    ligne.append(poignee);

    // Flèche pour replier les blocs décalés sous celui-ci
    const zoneRepli = document.createElement("span");
    zoneRepli.className = "repli-zone";
    if (aEnfants) {
      const fleche = document.createElement("button");
      fleche.type = "button";
      fleche.className = "repli" + (bloc.replie ? " replie" : "");
      fleche.setAttribute("aria-expanded", String(!bloc.replie));
      fleche.setAttribute("aria-label", bloc.replie ? "Déplier" : "Replier");
      fleche.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>';
      fleche.addEventListener("click", () => App.basculerRepli(bloc.id));
      zoneRepli.append(fleche);
    }
    ligne.append(zoneRepli);

    const contenu = document.createElement("div");
    contenu.className = "contenu";

    // Marque à gauche selon le type
    if (bloc.type === "tache") {
      const caseACocher = document.createElement("button");
      caseACocher.type = "button";
      caseACocher.className = "case";
      caseACocher.setAttribute("role", "checkbox");
      caseACocher.setAttribute("aria-checked", String(!!bloc.fait));
      caseACocher.setAttribute("aria-label", "Tâche terminée");
      caseACocher.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      caseACocher.addEventListener("click", () => cocher(bloc, ligne, caseACocher));
      contenu.append(caseACocher);
    } else if (bloc.type === "liste") {
      const puce = document.createElement("span");
      puce.className = "puce";
      puce.textContent = "•";
      contenu.append(puce);
    } else if (bloc.type === "numerotee") {
      const num = document.createElement("span");
      num.className = "numero";
      num.textContent = numero + ".";
      contenu.append(num);
    }

    if (bloc.type === "separateur") {
      const sep = document.createElement("div");
      sep.className = "sep champ";
      sep.tabIndex = 0;
      sep.setAttribute("aria-label", "Séparateur");
      sep.append(document.createElement("hr"));
      sep.addEventListener("focus", () => { dernierId = bloc.id; ligne.classList.add("actif"); });
      sep.addEventListener("blur", () => ligne.classList.remove("actif"));
      sep.addEventListener("keydown", (e) => gererSeparateur(e, bloc));
      contenu.append(sep);
    } else if (bloc.type === "image") {
      // Une photo, puis sa légende (modifiable comme un texte)
      const corps = document.createElement("div");
      corps.className = "corps";
      corps.append(creerFigure(bloc), creerZone(bloc, ligne));
      contenu.append(corps);
    } else {
      // Le texte, puis (pour les tâches) la date et les tags en dessous
      const corps = document.createElement("div");
      corps.className = "corps";
      corps.append(creerZone(bloc, ligne));
      const meta = App.creerMeta ? App.creerMeta(bloc) : null;
      if (meta) corps.append(meta);
      contenu.append(corps);

      if (bloc.type === "tache") {
        const detail = document.createElement("button");
        detail.type = "button";
        detail.className = "detail";
        detail.textContent = "📅";
        detail.setAttribute("aria-label", "Date, rappel et tags");
        detail.addEventListener("click", () => App.ouvrirDetails(bloc.id));
        contenu.append(detail);
      }
    }

    ligne.append(contenu);
    return ligne;
  }

  // La photo d'un bloc image (ou un bouton pour en choisir une)
  function creerFigure(bloc) {
    const figure = document.createElement("div");
    figure.className = "figure";
    if (bloc.src) {
      const bouton = document.createElement("button");
      bouton.type = "button";
      bouton.className = "figure-image";
      bouton.setAttribute("aria-label", "Agrandir l'image");
      const img = document.createElement("img");
      img.alt = bloc.texte || "Image";
      img.loading = "lazy";
      if (App.ImagesDB && App.ImagesDB.estRef(bloc.src)) {
        img.dataset.idbRef = bloc.src;
        const url = App.ImagesDB.obtenirSync(bloc.src);
        if (url) img.src = url;
        else App.ImagesDB.obtenir(bloc.src).then((data) => { if (data && img.isConnected) img.src = data; });
      } else {
        img.src = bloc.src;
      }
      bouton.append(img);
      bouton.addEventListener("click", () => App.agrandirImage(bloc));
      figure.append(bouton);
    } else {
      const choisir = document.createElement("button");
      choisir.type = "button";
      choisir.className = "figure-vide";
      choisir.innerHTML = '<span aria-hidden="true">🖼</span> Choisir une image';
      choisir.addEventListener("click", () => App.choisirImage(bloc.id));
      figure.append(choisir);
    }
    return figure;
  }

  // Coche ou décoche une tâche (et relance les tâches qui se répètent)
  function cocher(bloc, ligne, bouton) {
    const autres = App.basculerTache(bloc, () => afficher(null, null, bloc.id));
    ligne.classList.toggle("fait", bloc.fait);
    bouton.setAttribute("aria-checked", String(bloc.fait));
    App.majProgres(true);
    if (bloc.fait) App.confettis(bouton, 14);
    // d'autres tâches ont changé (sous-tâches ou tâche parente) : on redessine après l'animation
    if (autres) setTimeout(() => afficher(null, null, null), 320);
  }

  function creerZone(bloc, ligne) {
    const zone = document.createElement("div");
    zone.className = "texte champ";
    zone.contentEditable = "true";
    zone.setAttribute("role", "textbox");
    zone.setAttribute("aria-label", App.TYPES[bloc.type].nom);
    zone.dataset.placeholder = App.TYPES[bloc.type].placeholder;
    if (bloc.html) zone.innerHTML = bloc.html; // déjà nettoyé par App.assainir
    else zone.textContent = bloc.texte;        // textContent : jamais de HTML injecté

    zone.addEventListener("focus", () => { dernierId = bloc.id; ligne.classList.add("actif"); });
    zone.addEventListener("blur", () => ligne.classList.remove("actif"));

    // Un lien s'ouvre d'un toucher, sauf si on était déjà en train d'écrire dans ce bloc
    zone.addEventListener("pointerdown", () => { zone._etaitActif = document.activeElement === zone; });
    zone.addEventListener("click", (e) => {
      const lien = e.target.closest && e.target.closest("a");
      if (lien && (!zone._etaitActif || e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        window.open(lien.href, "_blank", "noopener,noreferrer");
      }
    });

    zone.addEventListener("input", () => {
      bloc.texte = lire(zone);
      bloc.html = zone.querySelector("b,i,u,s,code,a") ? App.assainir(zone.innerHTML) : "";
      if (bloc.texte === "") { zone.innerHTML = ""; bloc.html = ""; } // retire le <br> laissé par le navigateur

      // Raccourcis Markdown ("- " devient une liste, etc.)
      if (bloc.type === "paragraphe") {
        for (const [regle, type] of RACCOURCIS) {
          if (regle.test(bloc.texte)) {
            bloc.texte = bloc.texte.replace(regle, "");
            bloc.html = "";
            changerType(bloc, type);
            afficher(bloc.id, "fin");
            return;
          }
        }
      }

      // Menu "/" : s'ouvre quand le bloc contient seulement "/mot"
      const slash = /^\/([^\s]*)$/.exec(bloc.texte);
      if (slash) {
        App.MenuTypes.ouvrir(ligne, slash[1], (type) => {
          bloc.texte = "";
          bloc.html = "";
          changerType(bloc, type);
          afficher(bloc.id, "fin");
          apresType(bloc);
        }, "slash");
      } else if (App.MenuTypes.ouvert() && App.MenuTypes.origine() === "slash") {
        App.MenuTypes.fermer();
      }

      App.sauver();
    });

    zone.addEventListener("keydown", (e) => gererTouche(e, bloc, zone));

    // Collage en texte brut. Plusieurs lignes collées = plusieurs blocs.
    zone.addEventListener("paste", (e) => {
      e.preventDefault();
      const brut = (e.clipboardData || window.clipboardData).getData("text/plain").replace(/\r/g, "");
      const lignes = brut.split("\n");
      document.execCommand("insertText", false, lignes[0]);
      if (lignes.length > 1) {
        bloc.texte = lire(zone);
        bloc.html = zone.querySelector("b,i,u,s,code,a") ? App.assainir(zone.innerHTML) : "";
        const type = App.TYPES_LISTE.includes(bloc.type) ? bloc.type : "paragraphe";
        let precedent = bloc.id;
        lignes.slice(1).filter((l) => l.trim() !== "").forEach((l) => {
          const nouveau = App.nouveauBloc(type, l.trim());
          nouveau.niveau = bloc.niveau;
          insererApres(precedent, nouveau);
          precedent = nouveau.id;
        });
        afficher(precedent, "fin");
      }
    });

    return zone;
  }


  /* ---------- Curseur ---------- */

  // Positions de début et de fin de la sélection, comptées en caractères
  function positionCurseur(zone) {
    const sel = window.getSelection();
    const longueur = zone.textContent.length;
    if (!sel || sel.rangeCount === 0 || !zone.contains(sel.anchorNode)) {
      return { debut: longueur, fin: longueur, longueur: longueur };
    }
    const r = sel.getRangeAt(0);
    const avantDebut = document.createRange();
    avantDebut.selectNodeContents(zone);
    avantDebut.setEnd(r.startContainer, r.startOffset);
    const avantFin = document.createRange();
    avantFin.selectNodeContents(zone);
    avantFin.setEnd(r.endContainer, r.endOffset);
    return { debut: avantDebut.toString().length, fin: avantFin.toString().length, longueur: longueur };
  }

  // Place le curseur à un nombre de caractères du début (le texte peut contenir du gras, des liens…)
  function placerCurseur(champ, n) {
    const parcours = document.createTreeWalker(champ, NodeFilter.SHOW_TEXT);
    let reste = n;
    let noeud = parcours.nextNode();
    const plage = document.createRange();
    while (noeud) {
      if (reste <= noeud.textContent.length) {
        plage.setStart(noeud, reste);
        plage.collapse(true);
        return plage;
      }
      reste -= noeud.textContent.length;
      noeud = parcours.nextNode();
    }
    plage.selectNodeContents(champ);
    plage.collapse(false);
    return plage;
  }

  function focaliser(id, position) {
    const champ = conteneur.querySelector('.bloc[data-id="' + id + '"] .champ');
    if (!champ) return;
    champ.focus({ preventScroll: false });
    if (champ.classList.contains("sep")) return;

    let plage;
    if (position === "debut") {
      plage = document.createRange();
      plage.selectNodeContents(champ);
      plage.collapse(true);
    } else if (typeof position === "number") {
      plage = placerCurseur(champ, position);
    } else {
      plage = document.createRange();
      plage.selectNodeContents(champ);
      plage.collapse(false);
    }
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(plage);
  }
  App.focaliser = focaliser;

  App.curseurActuel = function () {
    const actif = document.activeElement;
    if (actif && actif.classList && actif.classList.contains("texte") && conteneur.contains(actif)) {
      return { id: actif.closest(".bloc").dataset.id, pos: positionCurseur(actif).debut };
    }
    return null;
  };


  /* ---------- Clavier ---------- */

  function gererTouche(e, bloc, zone) {
    const menu = App.MenuTypes;

    // Navigation dans le menu "/"
    if (menu.ouvert() && menu.origine() === "slash") {
      if (e.key === "ArrowDown") { e.preventDefault(); menu.bouger(1); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); menu.bouger(-1); return; }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); menu.valider(); return; }
      if (e.key === "Escape") { e.preventDefault(); menu.fermer(); return; }
    }

    const pos = positionCurseur(zone);

    // Entrée : nouveau bloc (coupe le texte à l'endroit du curseur)
    if (e.key === "Enter") {
      e.preventDefault();

      // "---" puis Entrée : séparateur
      if (bloc.texte.trim() === "---") {
        bloc.html = "";
        changerType(bloc, "separateur");
        const suite = App.nouveauBloc("paragraphe");
        insererApres(bloc.id, suite);
        afficher(suite.id, "debut", bloc.id);
        return;
      }

      // Entrée sur une liste ou une tâche vide : on en sort (comme Notion)
      const vide = bloc.texte === "";
      if (vide && (App.TYPES_LISTE.includes(bloc.type) || bloc.type === "citation")) {
        if (bloc.niveau > 0) bloc.niveau--;
        else changerType(bloc, "paragraphe");
        afficher(bloc.id, "fin");
        return;
      }

      // Découpe le contenu DOM à l'endroit du curseur pour préserver gras, italique, liens, etc.
      const sel = window.getSelection();
      let r;
      if (sel && sel.rangeCount > 0 && zone.contains(sel.anchorNode)) {
        r = sel.getRangeAt(0).cloneRange();
      } else {
        r = document.createRange();
        r.selectNodeContents(zone);
        r.collapse(false);
      }
      if (!r.collapsed) r.deleteContents();
      const plageApres = document.createRange();
      plageApres.setStart(r.endContainer, r.endOffset);
      plageApres.setEnd(zone, zone.childNodes.length);
      const fragApres = plageApres.extractContents();
      const contApres = document.createElement("div");
      contApres.append(fragApres);

      const avant = lire(zone);
      const apres = lire(contApres);
      bloc.texte = avant;
      bloc.html = avant && zone.querySelector("b,i,u,s,code,a") ? App.assainir(zone.innerHTML) : "";

      const type = App.TYPES_LISTE.includes(bloc.type) ? bloc.type : "paragraphe";
      const nouveau = App.nouveauBloc(type, apres);
      nouveau.html = apres && contApres.querySelector("b,i,u,s,code,a") ? App.assainir(contApres.innerHTML) : "";
      nouveau.niveau = bloc.niveau;
      insererApres(bloc.id, nouveau);
      afficher(nouveau.id, "debut", nouveau.id);
      return;
    }

    // Tab / Maj+Tab : décaler le bloc
    if (e.key === "Tab") {
      e.preventDefault();
      if (App.indenter(bloc.id, e.shiftKey ? -1 : 1)) afficher(bloc.id, pos.debut);
      return;
    }

    // Retour arrière au début d'un bloc
    if (e.key === "Backspace" && pos.debut === 0 && pos.fin === 0) {
      if (bloc.type === "image") { e.preventDefault(); return; }   // l'image se supprime par le menu du bloc
      const avantLui = voisin(bloc.id, -1);
      if (avantLui && avantLui.type === "image") {
        e.preventDefault();
        if (bloc.texte === "" && bloc.type === "paragraphe") blocs().splice(index(bloc.id), 1);
        afficher(avantLui.id, "fin");
        return;
      }
      if (bloc.niveau > 0) {
        e.preventDefault();
        if (App.indenter(bloc.id, -1)) afficher(bloc.id, 0);
        return;
      }
      if (bloc.type !== "paragraphe") {
        e.preventDefault();
        changerType(bloc, "paragraphe");
        afficher(bloc.id, 0);
        return;
      }
      const precedent = voisin(bloc.id, -1);
      if (precedent) {
        e.preventDefault();
        if (precedent.type === "separateur") {
          blocs().splice(index(precedent.id), 1);
          afficher(bloc.id, 0);
        } else {
          const longueur = precedent.texte.length;
          if (precedent.html || bloc.html) {
            const fusion = document.createElement("div");
            if (precedent.html) fusion.innerHTML = precedent.html;
            else fusion.textContent = precedent.texte;
            const suite = document.createElement("div");
            if (bloc.html) suite.innerHTML = bloc.html;
            else suite.textContent = bloc.texte;
            while (suite.firstChild) fusion.append(suite.firstChild);
            precedent.texte += bloc.texte;
            precedent.html = precedent.texte && fusion.querySelector("b,i,u,s,code,a") ? App.assainir(fusion.innerHTML) : "";
          } else {
            precedent.texte += bloc.texte;
          }
          blocs().splice(index(bloc.id), 1);
          afficher(precedent.id, longueur);
        }
      }
      return;
    }

    // Flèches : passer d'un bloc à l'autre
    if (e.key === "ArrowUp" && pos.debut === 0 && pos.fin === 0 && !e.shiftKey) {
      const v = voisin(bloc.id, -1);
      if (v) { e.preventDefault(); focaliser(v.id, "fin"); }
    }
    if (e.key === "ArrowDown" && pos.debut === pos.longueur && pos.fin === pos.longueur && !e.shiftKey) {
      const v = voisin(bloc.id, 1);
      if (v) { e.preventDefault(); focaliser(v.id, "debut"); }
    }
  }

  function gererSeparateur(e, bloc) {
    if (e.key === "Backspace" || e.key === "Delete") {
      e.preventDefault();
      App.supprimerBloc(bloc.id);
    } else if (e.key === "Enter") {
      e.preventDefault();
      const suite = App.nouveauBloc("paragraphe");
      insererApres(bloc.id, suite);
      afficher(suite.id, "fin", suite.id);
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      const v = voisin(bloc.id, e.key === "ArrowUp" ? -1 : 1);
      if (v) { e.preventDefault(); focaliser(v.id, e.key === "ArrowUp" ? "fin" : "debut"); }
    }
  }


  /* ---------- Actions sur les blocs (aussi utilisées par les menus) ---------- */

  // Ajoute un bloc du type donné sous le bloc en cours
  App.ajouterBloc = function (type) {
    const courant = blocs().find((b) => b.id === dernierId);

    // Un paragraphe vide est simplement transformé, pour ne pas empiler des blocs vides
    if (courant && courant.type === "paragraphe" && courant.texte === "" && type !== "separateur") {
      changerType(courant, type);
      afficher(courant.id, "fin", courant.id);
      apresType(courant);
      return;
    }

    const nouveau = App.nouveauBloc(type);
    if (courant && App.TYPES_LISTE.includes(type)) nouveau.niveau = courant.niveau;
    if (courant) insererApres(courant.id, nouveau);
    else blocs().push(nouveau);

    if (type === "separateur") {
      const suite = App.nouveauBloc("paragraphe");
      insererApres(nouveau.id, suite);
      afficher(suite.id, "fin", nouveau.id);
    } else {
      afficher(nouveau.id, "fin", nouveau.id);
      apresType(nouveau);
    }
  };

  App.convertir = function (id, type) {
    const bloc = blocs()[index(id)];
    if (!bloc) return;
    if (type === "separateur") bloc.html = "";
    changerType(bloc, type);
    afficher(null, null, id);
    apresType(bloc);
  };

  // Décale un bloc, avec tous les blocs qui lui sont rattachés (delta = 1 ou -1)
  App.indenter = function (id, delta) {
    const bl = blocs();
    const i = index(id);
    const bloc = bl[i];
    if (!bloc) return false;
    const maximum = i === 0 ? 0 : Math.min(3, bl[i - 1].niveau + 1);
    const niveau = Math.max(0, Math.min(maximum, bloc.niveau + delta));
    if (niveau === bloc.niveau) return false;
    const d = niveau - bloc.niveau;
    const fin = finSousArbre(i);
    for (let j = i + 1; j < fin; j++) {
      if (bl[j].niveau + d > 3 || bl[j].niveau + d < 0) return false;
    }
    for (let j = i; j < fin; j++) bl[j].niveau += d;
    return true;
  };

  App.decaler = function (id, delta) {
    if (App.indenter(id, delta)) afficher(null, null, id);
  };

  // Monte ou descend un bloc avec ses blocs rattachés
  App.deplacer = function (id, delta) {
    const bl = blocs();
    const i = index(id);
    if (i === -1) return;
    const fin = finSousArbre(i);
    let cible;
    if (delta < 0) {
      cible = i - 1;
      while (cible > 0 && bl[cible].niveau > bl[i].niveau) cible--;
      if (cible < 0) return;
    } else {
      if (fin >= bl.length) return;
      cible = finSousArbre(fin);
    }
    const groupe = bl.splice(i, fin - i);
    bl.splice(delta < 0 ? cible : cible - groupe.length, 0, ...groupe);
    afficher(null, null, id);
  };

  App.dupliquer = function (id) {
    const i = index(id);
    if (i === -1) return;
    const copie = JSON.parse(JSON.stringify(blocs()[i]));
    copie.id = App.id();
    copie.replie = false;
    copie.rappele = "";
    blocs().splice(i + 1, 0, copie);
    afficher(null, null, copie.id);
  };

  App.colorer = function (id, couleur) {
    const bloc = blocs()[index(id)];
    if (!bloc) return;
    bloc.couleur = couleur || "";
    afficher(null, null, id);
  };

  App.basculerRepli = function (id) {
    const bloc = blocs()[index(id)];
    if (!bloc) return;
    bloc.replie = !bloc.replie;
    afficher();
  };

  // Supprime un bloc (et ses blocs repliés), l'envoie à la corbeille, propose d'annuler
  App.supprimerBloc = function (id) {
    const bl = blocs();
    const i = index(id);
    if (i === -1) return;
    const fin = bl[i].replie ? finSousArbre(i) : i + 1;
    const supprimes = bl.slice(i, fin);
    const etaitSeul = supprimes.length === bl.length;
    const page = App.page();
    const ligne = conteneur.querySelector('.bloc[data-id="' + id + '"]');
    const idCorbeille = App.id();

    const terminer = () => {
      bl.splice(i, fin - i);
      if (bl.length === 0) bl.push(App.nouveauBloc("paragraphe"));
      if (supprimes.some((b) => b.texte.trim() !== "" || b.type === "separateur" || (b.type === "image" && !!b.src))) {
        App.etat.corbeille.unshift({
          id: idCorbeille, kind: "bloc", date: Date.now(),
          pageId: page.id, pageTitre: page.titre, index: i, data: supprimes,
        });
      }
      afficher((bl[i - 1] || bl[0]).id, "fin");
      App.Toast.afficher(supprimes.length > 1 ? supprimes.length + " blocs supprimés" : "Bloc supprimé", {
        action: "Annuler",
        surAction: () => {
          App.etat.corbeille = App.etat.corbeille.filter((e) => e.id !== idCorbeille);
          if (etaitSeul) bl.splice(0, bl.length);
          bl.splice(Math.min(i, bl.length), 0, ...supprimes);
          afficher(supprimes[0].id, "fin", supprimes[0].id);
        },
      });
    };

    if (ligne && !App.mouvementReduit()) {
      ligne.classList.add("sortie");
      setTimeout(terminer, 180);
    } else {
      terminer();

  /* ---------- Recherche dans la page ---------- */

  function appliquerRecherche() {

    conteneur.classList.toggle("en-recherche", !!q);
    let trouves = 0;
    conteneur.querySelectorAll(".bloc").forEach((ligne) => {
      const bloc = blocs().find((b) => b.id === ligne.dataset.id);
      const ok = !q || (bloc && App.simplifier(bloc.texte + " " + (bloc.tags || []).join(" ")).includes(q));
      ligne.classList.toggle("masque-recherche", !ok);
      ligne.classList.toggle("trouve", !!q && ok);
      if (q && ok) trouves++;
    });
    if (App.majCompteurRecherche) App.majCompteurRecherche(q ? trouves : null);
  }

  App.rechercherDansPage = function (q) {

    filtreRecherche = q;
    if (avait !== !!q) rendu(null, null, null, false); // les blocs repliés réapparaissent pendant la recherche
    else appliquerRecherche();

  /* ---------- Glisser-déposer (souris et doigt) ---------- */

  function glisser(e, id, ligne, poignee) {
    if (e.button) return; // clic droit ou autre : on ignore
    e.preventDefault();
    poignee.setPointerCapture(e.pointerId);

    const departY = e.clientY;
    const departDefilement = window.scrollY;
    let bouge = false;
    let cible = null; // bloc devant lequel on insère (null = à la fin)

    const autres = () => [...conteneur.querySelectorAll(".bloc")].filter((l) => l !== ligne);
    const nettoyer = () => {
      conteneur.querySelectorAll(".cible-avant").forEach((l) => l.classList.remove("cible-avant"));
      conteneur.classList.remove("cible-fin");
      ligne.classList.remove("deplace");
      ligne.style.transform = "";
      document.body.classList.remove("glisse");
    };

    function surMouvement(ev) {
      const dy = ev.clientY - departY + (window.scrollY - departDefilement);
      if (!bouge && Math.abs(dy) > 6) {
        bouge = true;
        ligne.classList.add("deplace");
        document.body.classList.add("glisse");
        App.MenuBloc.fermer();
      }
      if (!bouge) return;

      ligne.style.transform = "translateY(" + dy + "px) scale(1.02)";
      const r = ligne.getBoundingClientRect();
      const centre = r.top + r.height / 2;

      cible = null;
      for (const l of autres()) {
        const rr = l.getBoundingClientRect();
        if (centre < rr.top + rr.height / 2) { cible = l; break; }
      }
      conteneur.querySelectorAll(".cible-avant").forEach((l) => l.classList.remove("cible-avant"));
      conteneur.classList.remove("cible-fin");
      if (cible) cible.classList.add("cible-avant");
      else conteneur.classList.add("cible-fin");

      // Défilement automatique près des bords de l'écran
      if (ev.clientY < 90) window.scrollBy(0, -14);
      else if (ev.clientY > window.innerHeight - 130) window.scrollBy(0, 14);
    }

    function terminer(annule) {
      poignee.removeEventListener("pointermove", surMouvement);
      poignee.removeEventListener("pointerup", surFin);
      poignee.removeEventListener("pointercancel", surAnnulation);
      const idCible = cible ? cible.dataset.id : null;
      nettoyer();

      if (annule) return;
      if (!bouge) {
        App.MenuBloc.ouvrir(id, poignee); // simple toucher : menu du bloc
        return;
      }
      const bl = blocs();
      const i = index(id);
      const fin = finSousArbre(i);
      const groupe = bl.slice(i, fin);
      if (idCible && groupe.some((b) => b.id === idCible)) return; // déposé sur ses propres blocs rattachés
      bl.splice(i, fin - i);
      const j = idCible ? bl.findIndex((b) => b.id === idCible) : -1;
      if (j === -1) bl.push(...groupe);
      else bl.splice(j, 0, ...groupe);
      afficher(null, null, id);
    }
    const surFin = () => terminer(false);
    const surAnnulation = () => terminer(true);

    poignee.addEventListener("pointermove", surMouvement);
    poignee.addEventListener("pointerup", surFin);
    poignee.addEventListener("pointercancel", surAnnulation);
  }


  /* ---------- Barre de mise en forme (sur le texte sélectionné) ---------- */

  const barreFormat = document.getElementById("format");

  function zoneSelectionnee() {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    const noeud = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
    const zone = noeud && noeud.closest(".texte");
    return zone && conteneur.contains(zone) && zone.contains(sel.focusNode) ? zone : null;
  }

  document.addEventListener("selectionchange", () => {
    if (!zoneSelectionnee()) { barreFormat.hidden = true; return; }
    const r = window.getSelection().getRangeAt(0).getBoundingClientRect();
    if (!r.width && !r.height) { barreFormat.hidden = true; return; }
    barreFormat.hidden = false;
    const largeur = barreFormat.offsetWidth;
    const gauche = Math.max(8, Math.min(r.left + r.width / 2 - largeur / 2, window.innerWidth - largeur - 8));
    barreFormat.style.left = gauche + "px";
    barreFormat.style.top = Math.min(r.bottom + 10, window.innerHeight - 60) + "px";
  });

  barreFormat.addEventListener("mousedown", (e) => e.preventDefault()); // garde la sélection
  barreFormat.addEventListener("click", async (e) => {
    const bouton = e.target.closest("[data-format]");
    if (!bouton || !zoneSelectionnee()) return;
    const format = bouton.dataset.format;
    const sel = window.getSelection();

    if (format === "code") {
      const texte = sel.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      document.execCommand("insertHTML", false, "<code>" + texte + "</code>");
    } else if (format === "link") {
      const plage = sel.getRangeAt(0).cloneRange();
      const saisie = await App.Demander("Ajouter un lien", "Adresse du lien (par exemple https://exemple.com)", "", "https://");
      sel.removeAllRanges();
      sel.addRange(plage);
      if (saisie && saisie.trim()) {
        const url = /^(https?:|mailto:)/i.test(saisie.trim()) ? saisie.trim() : "https://" + saisie.trim();
        document.execCommand("createLink", false, url);
      }
    } else {
      document.execCommand(format);
    }
  });


  /* ---------- Barre du bas et bouton "Ajouter un bloc" ---------- */

  document.querySelectorAll(".barre [data-type]").forEach((bouton) => {
    bouton.addEventListener("mousedown", (e) => e.preventDefault()); // garde le curseur dans le bloc
    bouton.addEventListener("click", () => App.ajouterBloc(bouton.dataset.type));
  });

  const boutonPlus = document.getElementById("plus-types");
  boutonPlus.addEventListener("mousedown", (e) => e.preventDefault());
  boutonPlus.addEventListener("click", () => {
    App.MenuTypes.ouvrir(boutonPlus, "", (type) => App.ajouterBloc(type), "inserer");
  });

  document.getElementById("ajouter-fin").addEventListener("click", () => {
    const bl = blocs();
    const dernier = bl[bl.length - 1];
    if (dernier.type === "paragraphe" && dernier.texte === "") {
      focaliser(dernier.id, "fin");
    } else {
      const nouveau = App.nouveauBloc("paragraphe");
      bl.push(nouveau);
      afficher(nouveau.id, "fin", nouveau.id);
    }
  });
})();

      .map((cle) => Object.assign({ cle: cle }, App.TYPES[cle]))
      .filter((t) => !f || App.simplifier(t.nom + " " + t.cles.join(" ")).includes(f));

    if (etat.index >= etat.items.length) etat.index = 0;

    el.replaceChildren(...etat.items.map((t, i) => {
      const bouton = document.createElement("button");
      bouton.type = "button";
      bouton.className = "menu-item" + (i === etat.index ? " actif" : "");
      bouton.innerHTML = '<span class="menu-icone"></span><span class="menu-texte"><strong></strong><small></small></span>';
      bouton.querySelector(".menu-icone").textContent = t.icone;
      bouton.querySelector("strong").textContent = t.nom;
      bouton.querySelector("small").textContent = t.aide;
      // Garde le curseur dans le bloc pendant qu'on choisit
      bouton.addEventListener("mousedown", (e) => e.preventDefault());
      bouton.addEventListener("click", () => choisir(i));
      return bouton;
    }));
  }

  function positionner(ancre) {
    if (window.innerWidth <= 640) { // petit écran : le CSS en fait une feuille en bas
      el.style.left = "";
      el.style.top = "";
      return;
    }
    const r = ancre.getBoundingClientRect();
    const h = el.offsetHeight;
    let haut = r.bottom + 6;
    if (haut + h > window.innerHeight - 10) haut = Math.max(10, r.top - h - 6);
    const gauche = Math.max(10, Math.min(r.left + 36, window.innerWidth - el.offsetWidth - 10));
    el.style.top = haut + "px";
    el.style.left = gauche + "px";
  }

  function ouvrir(ancre, filtre, rappel, origine) {
    const nouvelle = !etat.ouvert || etat.origine !== (origine || "slash");
    if (nouvelle || (filtre || "") !== etat.filtre) etat.index = 0;
    etat.origine = origine || "slash";
    etat.rappel = rappel;
    etat.filtre = filtre || "";
    construire();
    if (etat.items.length === 0) { fermer(); return; }
    el.hidden = false;
    etat.ouvert = true;
    positionner(ancre);

  function fermer() {
    el.hidden = true;
    etat.ouvert = false;

  function bouger(delta) {

    etat.index = (etat.index + delta + n) % n;
    [...el.children].forEach((b, i) => b.classList.toggle("actif", i === etat.index));
    const actif = el.children[etat.index];

    fermer();
    if (type && rappel) rappel(type.cle);

  // Clavier pour les menus ouverts depuis un bouton (le menu "/" est géré par l'éditeur)
  document.addEventListener("keydown", (e) => {

    if (e.key === "ArrowDown") { e.preventDefault(); bouger(1); }

  <script>
"use strict";

/* =====================================================
   taches.js : dates limites, tags, répétition, rappels
   ===================================================== */

/* ---------- Sous-tâches ----------
   Une tâche décalée sous une autre est sa sous-tâche. La tâche parente affiche
   « 2/4 », se coche d'un coup avec toutes ses sous-tâches, et se coche toute seule
   quand la dernière sous-tâche est faite. */

function sousTaches(page, i) {
  const bl = page.blocs;
  const liste = [];
  for (let j = i + 1; j < bl.length && bl[j].niveau > bl[i].niveau; j++) {
    if (bl[j].type === "tache") liste.push(bl[j]);
  }
  return liste;
}

// La tâche parente directe (le bloc juste au-dessus, moins décalé), s'il s'agit d'une tâche
function parentDe(page, i) {
  for (let j = i - 1; j >= 0; j--) {
    if (page.blocs[j].niveau < page.blocs[i].niveau) return page.blocs[j].type === "tache" ? page.blocs[j] : null;
  }
  return null;
}

// { faits, total } pour une tâche qui a des sous-tâches, sinon null
App.progression = function (bloc) {
  const lieu = trouverBloc(bloc.id);
  if (!lieu) return null;
  const enfants = sousTaches(lieu.page, lieu.page.blocs.indexOf(bloc));
  return enfants.length ? { faits: enfants.filter((b) => b.fait).length, total: enfants.length } : null;
};

function terminer(bloc, etat) {
  if (!!bloc.fait === etat) return false;
  bloc.fait = etat;
  bloc.encours = false;
  bloc.faitLe = etat ? Date.now() : 0;
  App.compter("faits", etat ? 1 : -1);
  return true;
}


/* ---------- Cocher / décocher (aussi utilisé par les vues) ---------- */

// Coche ou décoche une tâche. Si elle se répète, elle revient avec la date suivante.
// Renvoie true quand d'autres tâches ont changé en même temps (sous-tâches, tâche parente).
App.basculerTache = function (bloc, surRecurrence) {
  const lieu = trouverBloc(bloc.id);
  let autres = false;
  terminer(bloc, !bloc.fait);

  if (lieu) {
    const i = lieu.page.blocs.indexOf(bloc);
    // Cocher la tâche parente coche toutes ses sous-tâches
    if (bloc.fait) sousTaches(lieu.page, i).forEach((s) => { if (terminer(s, true)) autres = true; });
    // Cocher la dernière sous-tâche coche le parent ; décocher une sous-tâche décoche le parent
    const parent = parentDe(lieu.page, i);
    if (parent) {
      autres = true;   // la progression « 1/2 » de la tâche parente doit se mettre à jour
      const freres = sousTaches(lieu.page, lieu.page.blocs.indexOf(parent));
      const tout = freres.every((s) => s.fait);
      terminer(parent, tout);
    }
  }
  App.sauver();

  if (bloc.fait && bloc.repete && bloc.echeance) {
    setTimeout(() => {
      if (!bloc.fait) return; // décochée entre-temps
      bloc.echeance = App.prochaineEcheance(bloc.echeance, bloc.repete);
      // la tâche revient : elle reste comptée dans les statistiques du jour où elle a été faite
      bloc.fait = false;
      bloc.faitLe = 0;
      bloc.rappele = "";
      // ... et ses sous-tâches reviennent avec elle
      const l = trouverBloc(bloc.id);
      if (l) sousTaches(l.page, l.page.blocs.indexOf(bloc)).forEach((s) => { s.fait = false; s.faitLe = 0; });
      App.sauver();
      if (surRecurrence) surRecurrence();
      App.Toast.afficher("Prochaine fois : " + App.etiquetteDate(bloc.echeance));
    }, 700);
  }
  return autres;
};


/* ---------- Pastilles sous une tâche (progression, date, tags) ---------- */

App.creerMeta = function (bloc) {
  if (bloc.type !== "tache") return null;
  const pastilles = [];
  const prog = App.progression(bloc);
  if (prog) {
    const pourcent = Math.round(prog.faits / prog.total * 100);
    pastilles.push(App.el("span", { class: "chip progression" + (prog.faits === prog.total ? " complet" : ""), title: pourcent + " % des sous-tâches faites" },
      App.el("span", { class: "mini-barre", "aria-hidden": "true" }, App.el("i", { style: "width:" + pourcent + "%" })),
      prog.faits + "/" + prog.total));
  }
  if (bloc.encours && !bloc.fait) pastilles.push(App.el("span", { class: "chip encours" }, "⏳ En cours"));
  if (bloc.echeance) {
    pastilles.push(App.el("button", {
      type: "button",
      class: "chip date " + App.statutDate(bloc),
      title: "Modifier la date",
      onclick: () => App.ouvrirDetails(bloc.id),
    }, "📅 " + App.etiquetteDate(bloc.echeance, bloc.heure) + (bloc.repete ? " 🔁" : "")));
  }
  bloc.tags.forEach((tag) => {
    pastilles.push(App.el("button", {
      type: "button", class: "chip tag", title: "Voir toutes les tâches #" + tag,
      onclick: () => App.Vues.ouvrir({ type: "tag", tag: tag }),
    }, "#" + tag));
  });
  return pastilles.length ? App.el("div", { class: "meta" }, pastilles) : null;
};


/* ---------- Fenêtre « Date, rappel, tags » ---------- */

function trouverBloc(id) {
  for (const page of App.etat.pages) {
    const bloc = page.blocs.find((b) => b.id === id);
    if (bloc) return { page: page, bloc: bloc };
  }
  return null;
}

App.tousLesTags = function () {
  const compte = {};
  App.toutesLesTaches().forEach(({ bloc }) => bloc.tags.forEach((t) => { compte[t] = (compte[t] || 0) + 1; }));
  return compte;
};

App.ouvrirDetails = function (id) {
  const trouve = trouverBloc(id);
  if (!trouve) return;
  const { page, bloc } = trouve;

  const date = App.el("input", { type: "date", value: bloc.echeance, "aria-label": "Date limite" });
  const heure = App.el("input", { type: "time", value: bloc.heure, "aria-label": "Heure du rappel" });
  const repete = App.el("select", { "aria-label": "Répétition" },
    Object.keys(App.REPETITIONS).map((cle) => App.el("option", { value: cle, selected: cle === bloc.repete }, App.REPETITIONS[cle])));
  const tags = App.el("input", {
    type: "text", value: bloc.tags.join(", "), placeholder: "cours, urgent, perso", list: "liste-tags", autocomplete: "off", "aria-label": "Tags",
  });
  const suggestions = App.el("datalist", { id: "liste-tags" },
    Object.keys(App.tousLesTags()).map((t) => App.el("option", { value: t })));

  const rapide = (texte, jours) => App.el("button", {
    type: "button", class: "btn-rapide", onclick: () => { date.value = App.ajouterJours(App.aujourdhui(), jours); },
  }, texte);

  // État des rappels
  const etatRappels = App.el("p", { class: "aide" });
  const boutonRappels = App.el("button", { type: "button", class: "btn-secondaire", onclick: async () => {
    await App.Rappels.activer();
    majRappels();
  } }, "🔔 Activer les rappels");
  function majRappels() {
    const actifs = App.Rappels.actifs();
    etatRappels.textContent = actifs
      ? "Les rappels sont activés : une notification s'affiche à l'heure choisie (8 h par défaut), tant que l'appli est ouverte."
      : "Les rappels ne sont pas activés. Un message s'affichera quand même dans l'appli à l'heure choisie.";
    boutonRappels.hidden = actifs;
  }
  majRappels();

  const enregistrer = () => {
    bloc.echeance = date.value || "";
    bloc.heure = date.value ? heure.value : "";
    bloc.repete = date.value ? repete.value : "";
    bloc.tags = [...new Set(tags.value.split(/[,;\n]/).map(App.nettoyerTag).filter(Boolean))].slice(0, 8);
    bloc.rappele = "";
    App.Feuille.fermer();
    if (page.id === App.page().id) App.afficherBlocs(null, null, id);
    else App.sauver();
  };

  App.Feuille.ouvrir("Détails de la tâche", [
    App.el("p", { class: "feuille-sous-titre" }, bloc.texte || "Tâche sans titre"),
    App.el("div", { class: "champ-form" },
      App.el("label", null, "Date limite"),
      date,
      App.el("div", { class: "rapides" }, rapide("Aujourd'hui", 0), rapide("Demain", 1), rapide("Dans 1 semaine", 7))),
    App.el("div", { class: "deux-colonnes" },
      App.el("div", { class: "champ-form" }, App.el("label", null, "Heure du rappel"), heure),
      App.el("div", { class: "champ-form" }, App.el("label", null, "Répéter"), repete)),
    App.el("div", { class: "champ-form" }, App.el("label", null, "Tags (séparés par des virgules)"), tags, suggestions),
    App.el("div", { class: "champ-form" }, etatRappels, boutonRappels),
    App.el("div", { class: "actions" },
      App.el("button", { type: "button", class: "btn-primaire", onclick: enregistrer }, "Enregistrer"),
      App.el("button", { type: "button", class: "btn-secondaire", onclick: () => { date.value = ""; heure.value = ""; repete.value = ""; } }, "Effacer la date"),
      App.el("button", { type: "button", class: "btn-secondaire", onclick: () => App.Feuille.fermer() }, "Annuler")),
  ]);
};


/* ---------- Rappels ---------- */

App.Rappels = (function () {
  const gere = "Notification" in window;

  const actifs = () => gere && Notification.permission === "granted" && !!App.etat.reglages.rappels;

  async function activer() {
    if (!gere) { App.Toast.afficher("Ce navigateur ne gère pas les notifications"); return false; }
    let permission = Notification.permission;
    if (permission === "default") permission = await Notification.requestPermission();
    App.etat.reglages.rappels = permission === "granted";
    App.sauver();
    App.Toast.afficher(permission === "granted" ? "Rappels activés 🔔"
      : "Notifications bloquées : autorise-les dans les réglages du site");
    return permission === "granted";
  }

  function desactiver() {
    App.etat.reglages.rappels = false;
    App.sauver();
  }

  function notifier(bloc, page) {
    const texte = bloc.texte || "Tâche sans titre";
    App.Toast.afficher("⏰ Rappel : " + texte, {
      action: "Voir", duree: 9000, surAction: () => App.ouvrirPage(page.id),
    });
    if (!actifs()) return;
    const titre = "⏰ " + texte;
    const options = { body: page.titre || "Sans titre", icon: "icons/icon-192.png", tag: bloc.id };
    const direct = () => { try { new Notification(titre, options); } catch (erreur) { /* Android exige le service worker */ } };
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistration()
        .then((r) => (r ? r.showNotification(titre, options) : direct()))
        .catch(direct);
    } else {
      direct();
    }
  }

  // Cherche les tâches dont l'heure est arrivée (et pas encore signalées)
  function verifier() {
    const maintenant = Date.now();
    let modifie = false;
    App.toutesLesTaches().forEach(({ page, bloc }) => {
      if (bloc.fait || !bloc.echeance) return;
      const heure = bloc.heure || "08:00";
      const cle = bloc.echeance + "T" + heure;
      if (bloc.rappele === cle) return;
      const [h, m] = heure.split(":").map(Number);
      const prevu = new Date(bloc.echeance + "T00:00:00");
      prevu.setHours(h, m, 0, 0);
      const ecart = maintenant - prevu.getTime();
      if (ecart >= 0 && ecart < 12 * 3600e3) { // on ne rappelle pas ce qui date de plus de 12 h
        bloc.rappele = cle;
        modifie = true;
        notifier(bloc, page);
      }
    });
    if (modifie) App.sauver();
  }

  setInterval(verifier, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) verifier(); });
  setTimeout(verifier, 2500);

  return { activer: activer, desactiver: desactiver, actifs: actifs, verifier: verifier };
})();

  <script>
"use strict";

/* =====================================================
   vues.js : « Aujourd'hui », « En retard », « À venir » et tags
   Des listes de tâches qui rassemblent toutes les pages.
   ===================================================== */

App.Vues = (function () {
  const boutons = document.getElementById("vues");
  const zone = document.getElementById("vue-page");
  const pagePrincipale = document.getElementById("page");
  let vue = null;      // { type: "aujourdhui" | "retard" | "avenir" | "tag", tag }
  let minuteur = null;

  const TITRES = {
    aujourdhui: { icone: "📅", nom: "Aujourd'hui" },
    retard: { icone: "⚠️", nom: "En retard" },
    avenir: { icone: "🗓", nom: "À venir" },
  };

  function filtrer(v) {
    let liste = App.toutesLesTaches();
    if (v.type === "tag") {
      liste = liste.filter(({ bloc }) => bloc.tags.includes(v.tag));
    } else if (v.type === "aujourdhui") {
      liste = liste.filter(({ bloc }) => App.statutDate(bloc) === "aujourdhui");
    } else {
      liste = liste.filter(({ bloc }) => App.statutDate(bloc) === v.type);
    }
    // Les tâches faites à la fin, puis par date
    return liste.sort((a, b) =>
      (a.bloc.fait - b.bloc.fait) || (a.bloc.echeance || "9999").localeCompare(b.bloc.echeance || "9999"));
  }

  const compter = (v) => filtrer(v).filter(({ bloc }) => !bloc.fait).length;
  const memeVue = (a, b) => a && b && a.type === b.type && a.tag === b.tag;


  /* ---------- Boutons du menu latéral ---------- */

  function afficherBoutons() {
    const un = (v, icone, nom) => {
      const n = (v.type === "tableau" || v.type === "calendrier") ? 0 : compter(v);
      return App.el("button", {
        type: "button",
        class: "vue-item" + (memeVue(vue, v) ? " actif" : "") + (v.type === "retard" && n ? " alerte" : ""),
        onclick: () => ouvrir(v),
      }, App.el("span", { class: "vue-icone" }, icone), App.el("span", { class: "vue-nom" }, nom), n ? App.el("span", { class: "vue-compte" }, String(n)) : null);
    };

    const tags = Object.keys(App.tousLesTags()).sort();
    boutons.replaceChildren(
      un({ type: "aujourdhui" }, "📅", "Aujourd'hui"),
      un({ type: "retard" }, "⚠️", "En retard"),
      un({ type: "avenir" }, "🗓", "À venir"),
      un({ type: "tableau" }, "▦", "Tableau"),
      un({ type: "calendrier" }, "🗓️", "Calendrier"),
      ...tags.map((t) => un({ type: "tag", tag: t }, "#", t))
    );
  }


  /* ---------- Page de la vue ---------- */

  // Une ligne de tâche (case, texte, page d'origine, date, tags). Réutilisée par le calendrier.
  function ligneTache(page, bloc, rafraichir) {
    rafraichir = rafraichir || afficherVue;
    const case_ = App.el("button", {
        type: "button", class: "case", role: "checkbox", "aria-checked": String(!!bloc.fait), "aria-label": "Tâche terminée",
        onclick: () => {
          App.basculerTache(bloc, rafraichir);
          case_.setAttribute("aria-checked", String(bloc.fait));
          ligne.classList.toggle("fait", bloc.fait);
          if (bloc.fait) App.confettis(case_, 14);
        },
      });
      case_.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

      const texte = App.el("button", {
        type: "button", class: "vue-texte", title: "Ouvrir la page",
        onclick: () => {
          App.ouvrirPage(page.id);
          setTimeout(() => App.focaliser(bloc.id, "fin"), 60);
        },
      }, bloc.texte || "Tâche sans titre");

      const meta = App.el("div", { class: "meta" },
        App.el("span", { class: "chip page-chip" }, page.icone + " " + (page.titre || "Sans titre")),
        bloc.echeance ? App.el("span", { class: "chip date " + App.statutDate(bloc) }, "📅 " + App.etiquetteDate(bloc.echeance, bloc.heure) + (bloc.repete ? " 🔁" : "")) : null,
        bloc.tags.map((t) => App.el("button", { type: "button", class: "chip tag", onclick: () => ouvrir({ type: "tag", tag: t }) }, "#" + t)));

      const ligne = App.el("div", { class: "vue-ligne" + (bloc.fait ? " fait" : "") },
        case_,
        App.el("div", { class: "corps" }, texte, meta),
        App.el("button", { type: "button", class: "detail visible", "aria-label": "Date, rappel et tags", onclick: () => App.ouvrirDetails(bloc.id) }, "📅"));
    return ligne;
  }


  function entete(icone, nom, sousTitre) {
    return [
      App.el("div", { class: "bandeau", "aria-hidden": "true" }),
      App.el("div", { class: "entete" },
        App.el("div", { class: "icone-page statique", "aria-hidden": "true" }, icone),
        App.el("h1", { class: "titre-vue" }, nom),
        App.el("p", { class: "sous-titre-vue" }, sousTitre)),
    ];
  }

  function afficherVue() {
    if (!vue) return;
    if (vue.type === "tableau" || vue.type === "calendrier") {
      const r = App.VuesPlus[vue.type]();
      zone.replaceChildren(...entete(r.icone, r.nom, r.sousTitre), r.contenu);
      return;
    }
    const titre = vue.type === "tag" ? { icone: "🏷", nom: "#" + vue.tag } : TITRES[vue.type];
    const liste = filtrer(vue);
    const restantes = liste.filter(({ bloc }) => !bloc.fait).length;

    const lignes = liste.map(({ page, bloc }) => ligneTache(page, bloc));

    zone.replaceChildren(
      App.el("div", { class: "bandeau", "aria-hidden": "true" }),
      App.el("div", { class: "entete" },
        App.el("div", { class: "icone-page statique", "aria-hidden": "true" }, titre.icone),
        App.el("h1", { class: "titre-vue" }, titre.nom),
        App.el("p", { class: "sous-titre-vue" }, restantes
          ? restantes + " tâche" + (restantes > 1 ? "s" : "") + " à faire"
          : (liste.length ? "Tout est fait 🎉" : "Rien ici pour le moment"))),
      lignes.length ? App.el("div", { class: "vue-liste" }, lignes)
        : App.el("p", { class: "vue-vide" },
          vue.type === "tag" ? "Aucune tâche avec ce tag."
            : "Ajoute une date limite à une tâche avec le bouton 📅 pour la retrouver ici."));
  }

  function ouvrir(v) {
    vue = v;
    document.body.classList.add("en-vue");
    document.body.classList.remove("menu-ouvert");
    pagePrincipale.hidden = true;
    zone.hidden = false;
    document.body.dataset.couleur = "violet";
    App.Toast.fermer();
    afficherVue();
    afficherBoutons();
    if (App.afficherPages) App.afficherPages();
    window.scrollTo(0, 0);
    if (!App.mouvementReduit()) {
      zone.classList.remove("change");
      void zone.offsetWidth;
      zone.classList.add("change");
    }
  }

  function fermer() {
    if (!vue) return;
    vue = null;
    document.body.classList.remove("en-vue");
    zone.hidden = true;
    pagePrincipale.hidden = false;
    afficherBoutons();
  }

  // Mise à jour après chaque changement (avec un petit délai pour laisser jouer les animations)
  App.ecouteurs.push(() => {
    clearTimeout(minuteur);
    minuteur = setTimeout(() => {
      afficherBoutons();
      if (vue) afficherVue();
    }, 450);
  });

  return { ouvrir: ouvrir, fermer: fermer, afficherBoutons: afficherBoutons, active: () => !!vue, ligneTache: ligneTache, rafraichir: () => { if (vue) afficherVue(); } };
})();

"use strict";

/* =====================================================
   donnees.js : sauvegarde (export/import), CSV, corbeille, statistiques
   ===================================================== */

(function () {
  const $ = (id) => document.getElementById(id);
  const pluriel = (n, mot) => n + " " + mot + (n > 1 ? "s" : "");

  function resoudreBlocsImages(blocs) {
    return (blocs || []).map((b) => (b && b.type === "image" && App.ImagesDB && App.ImagesDB.estRef(b.src)
      ? Object.assign({}, b, { src: App.ImagesDB.obtenirSync(b.src) })
      : b));
  }

  // Ce qui est sauvegardé ou envoyé au serveur (pas le thème ni les réglages de cet appareil)
  App.donneesExportables = function () {
    const pages = App.etat.pages.map((p) => Object.assign({}, p, { blocs: resoudreBlocsImages(p.blocs) }));
    const corbeille = App.etat.corbeille.map((e) => {
      if (e.kind === "page" && e.data && Array.isArray(e.data.blocs)) {
        return Object.assign({}, e, { data: Object.assign({}, e.data, { blocs: resoudreBlocsImages(e.data.blocs) }) });
      }
      if (e.kind === "bloc" && Array.isArray(e.data)) {
        return Object.assign({}, e, { data: resoudreBlocsImages(e.data) });
      }
      return e;
    });
    return {
      format: "mes-blocs", version: 3,
      pages: pages, corbeille: corbeille,
      supprimees: App.etat.supprimees, stats: App.etat.stats,
    };
  };

  // Remplace (ou fusionne) les données de l'appli puis réaffiche
  App.appliquerDonnees = function (n, options) {
    options = options || {};
    const idsAvant = App.etat.pages.map((p) => p.id);
    App._sansMaj = !!options.sansMaj;
    App.etat.pages = n.pages;
    App.etat.corbeille = n.corbeille;
    App.etat.supprimees = n.supprimees;
    App.etat.stats = n.stats;
    if (options.remplacer) {
      const maintenant = Date.now();
      n.pages.forEach((p) => { p.maj = maintenant; delete App.etat.supprimees[p.id]; });
      idsAvant.forEach((id) => { if (!n.pages.some((p) => p.id === id)) App.etat.supprimees[id] = maintenant; });
    }
    if (!App.etat.pages.some((p) => p.id === App.etat.courante)) App.etat.courante = App.etat.pages[0].id;
    App.sauver();
    App._sansMaj = false;
    if (options.sansMaj) App.initEmpreintes();
    if (App.ImagesDB) App.ImagesDB.migrerEtat(App.etat, true);
    if (options.afficher !== false) App.ouvrirPage(App.etat.courante, false);
  };


  /* ---------- Export / import ---------- */

  async function exporter() {
    App.Feuille.fermer();
    if (App.ImagesDB) await App.ImagesDB.pret();
    const jour = App.aujourdhui();
    App.telecharger("focusflow-" + jour + ".json", JSON.stringify(App.donneesExportables(), null, 2), "application/json");
    App.Toast.afficher("Sauvegarde téléchargée 💾");
  }

  function importer(fichier) {
    if (!fichier) return;
    if (fichier.size > 10 * 1024 * 1024) { App.Toast.afficher("Fichier trop gros (10 Mo maximum)"); return; }
    const lecteur = new FileReader();
    lecteur.onerror = () => App.Toast.afficher("Impossible de lire ce fichier");
    lecteur.onload = () => {
      let brut;
      try { brut = JSON.parse(lecteur.result); } catch (erreur) { brut = null; }
      if (!brut || typeof brut !== "object" || !Array.isArray(brut.pages)) {
        App.Toast.afficher("Ce fichier n'est pas une sauvegarde de FocusFlow");
        return;
      }
      const importe = App.normaliser(Object.assign({}, brut, { __sansDemo: true }));
      if (importe.pages.length === 0) { App.Toast.afficher("Cette sauvegarde ne contient aucune page"); return; }
      const nbTaches = importe.pages.reduce((n, p) => n + p.blocs.filter((b) => b.type === "tache").length, 0);

      App.Feuille.ouvrir("Importer une sauvegarde", [
        App.el("p", null, "Cette sauvegarde contient " + pluriel(importe.pages.length, "page") + " et " + pluriel(nbTaches, "tâche") + "."),
        App.el("p", { class: "aide" }, "Fusionner garde tes pages actuelles et y ajoute celles du fichier (la version la plus récente de chaque page l'emporte). Remplacer efface tout ce qui est sur cet appareil."),
        App.el("div", { class: "actions" },
          App.el("button", { type: "button", class: "btn-primaire", onclick: () => {
            App.appliquerDonnees(App.fusionner(App.normaliser(JSON.parse(JSON.stringify(App.donneesExportables()))), importe));
            App.Feuille.fermer();
            App.Toast.afficher("Sauvegarde fusionnée ✅");
          } }, "Fusionner"),
          App.el("button", { type: "button", class: "btn-danger", onclick: () => {
            App.appliquerDonnees(importe, { remplacer: true });
            App.Feuille.fermer();
            App.Toast.afficher("Données remplacées ✅");
          } }, "Remplacer tout"),
          App.el("button", { type: "button", class: "btn-secondaire", onclick: () => App.Feuille.fermer() }, "Annuler")),
      ]);
    };
    lecteur.readAsText(fichier);
  }


  /* ---------- CSV (pour Excel, pandas…) ---------- */

  function cellule(valeur, texteLibre) {
    let s = String(valeur == null ? "" : valeur);
    // Évite qu'Excel prenne un texte pour une formule
    if (texteLibre && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }
  const ligneCsv = (cases) => cases.join(";");

  function exporterTaches() {
    App.Feuille.fermer();
    const lignes = [ligneCsv(["page", "tache", "fait", "echeance", "heure", "repetition", "tags", "niveau"])];
    App.toutesLesTaches().forEach(({ page, bloc }) => {
      lignes.push(ligneCsv([
        cellule(page.titre || "Sans titre", true), cellule(bloc.texte, true), bloc.fait ? 1 : 0,
        cellule(bloc.echeance), cellule(bloc.heure), cellule(bloc.repete), cellule(bloc.tags.join(" "), true), bloc.niveau,
      ]));
    });
    App.telecharger("mes-taches-" + App.aujourdhui() + ".csv", "\uFEFF" + lignes.join("\r\n"), "text/csv;charset=utf-8");
    App.Toast.afficher("Tâches exportées en CSV 📄");
  }

  function exporterStats() {
    App.Feuille.fermer();
    const { faits, pomodoros } = App.etat.stats;
    const jours = [...new Set([...Object.keys(faits), ...Object.keys(pomodoros)])].sort();
    const lignes = [ligneCsv(["date", "taches_terminees", "pomodoros"])];
    jours.forEach((j) => lignes.push(ligneCsv([j, faits[j] || 0, pomodoros[j] || 0])));
    App.telecharger("mes-statistiques-" + App.aujourdhui() + ".csv", "\uFEFF" + lignes.join("\r\n"), "text/csv;charset=utf-8");
    App.Toast.afficher("Statistiques exportées en CSV 📊");
  }

  /* ---------- Export calendrier (.ics) ---------- */

  function echapperIcs(texte) {
    return String(texte || "")
      .replace(/\\/g, "\\\\")
      .replace(/;/g, "\\;")
      .replace(/,/g, "\\,")
      .replace(/\r?\n/g, "\\n");
  }

  function horodatageIcs(date) {
    const z = (n) => String(n).padStart(2, "0");
    return date.getUTCFullYear()
      + z(date.getUTCMonth() + 1)
      + z(date.getUTCDate())
      + "T"
      + z(date.getUTCHours())
      + z(date.getUTCMinutes())
      + z(date.getUTCSeconds())
      + "Z";
  }

  App.exporterICS = function () {
    if (App.Feuille && App.Feuille.ouverte()) App.Feuille.fermer();
    const taches = App.toutesLesTaches().filter(({ bloc }) => !!bloc.echeance);
    if (!taches.length) {
      App.Toast.afficher("Aucune tâche avec date limite à exporter");
      return;
    }

    const stamp = horodatageIcs(new Date());
    const lignes = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//FocusFlow//Calendrier Taches//FR",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "X-WR-CALNAME:FocusFlow",
    ];

    const REGLE_REP = { jour: "FREQ=DAILY", semaine: "FREQ=WEEKLY", mois: "FREQ=MONTHLY" };

    taches.forEach(({ page, bloc }) => {
      const dateCompacte = bloc.echeance.replace(/-/g, "");
      const titre = (bloc.fait ? "✅ " : "") + (bloc.texte || "Tâche sans titre");
      const descParts = ["Page : " + (page.icone || "📝") + " " + (page.titre || "Sans titre")];
      if (bloc.tags && bloc.tags.length) descParts.push("Tags : " + bloc.tags.map((t) => "#" + t).join(", "));

      lignes.push("BEGIN:VEVENT");
      lignes.push("UID:focusflow-" + bloc.id + "@focusflow.app");
      lignes.push("DTSTAMP:" + stamp);

      if (bloc.heure && /^\d{2}:\d{2}$/.test(bloc.heure)) {
        const [hh, mm] = bloc.heure.split(":").map(Number);
        const z = (n) => String(n).padStart(2, "0");
        const debut = dateCompacte + "T" + z(hh) + z(mm) + "00";
        const finDate = new Date(bloc.echeance + "T00:00:00");
        finDate.setHours(hh, mm + 30, 0, 0);
        const fin = App.iso(finDate).replace(/-/g, "") + "T" + z(finDate.getHours()) + z(finDate.getMinutes()) + "00";
        lignes.push("DTSTART:" + debut);
        lignes.push("DTEND:" + fin);
      } else {
        const lendemain = App.ajouterJours(bloc.echeance, 1).replace(/-/g, "");
        lignes.push("DTSTART;VALUE=DATE:" + dateCompacte);
        lignes.push("DTEND;VALUE=DATE:" + lendemain);
      }

      if (bloc.repete && REGLE_REP[bloc.repete]) {
        lignes.push("RRULE:" + REGLE_REP[bloc.repete]);
      }

      lignes.push("SUMMARY:" + echapperIcs(titre));
      lignes.push("DESCRIPTION:" + echapperIcs(descParts.join("\n")));
      if (bloc.tags && bloc.tags.length) {
        lignes.push("CATEGORIES:" + bloc.tags.map(echapperIcs).join(","));
      }
      lignes.push("STATUS:" + (bloc.fait ? "COMPLETED" : "NEEDS-ACTION"));

      if (bloc.heure && !bloc.fait) {
        lignes.push("BEGIN:VALARM");
        lignes.push("TRIGGER:-PT15M");
        lignes.push("ACTION:DISPLAY");
        lignes.push("DESCRIPTION:" + echapperIcs(titre));
        lignes.push("END:VALARM");
      }

      lignes.push("END:VEVENT");
    });

    lignes.push("END:VCALENDAR");
    App.telecharger("focusflow-calendrier-" + App.aujourdhui() + ".ics", lignes.join("\r\n") + "\r\n", "text/calendar;charset=utf-8");
    App.Toast.afficher(taches.length + " tâche" + (taches.length > 1 ? "s" : "") + " exportée" + (taches.length > 1 ? "s" : "") + " en .ics 📅");
  };

  function ouvrirSauvegarde() {
    const entree = App.el("input", { type: "file", accept: ".json,application/json", hidden: true, onchange: () => importer(entree.files[0]) });
    App.Feuille.ouvrir("Sauvegarde et export", [
      App.el("p", { class: "aide" }, "Tes données sont enregistrées dans ce navigateur. Fais une sauvegarde de temps en temps, ou pour les passer sur un autre appareil."),
      App.el("div", { class: "liste-actions" },
        App.el("button", { type: "button", class: "ligne-action", onclick: exporter },
          App.el("span", { class: "ligne-icone" }, "💾"), App.el("span", { class: "ligne-texte" }, App.el("strong", null, "Exporter une sauvegarde"), App.el("small", null, "Un fichier .json avec toutes tes pages"))),
        App.el("button", { type: "button", class: "ligne-action", onclick: () => entree.click() },
          App.el("span", { class: "ligne-icone" }, "📥"), App.el("span", { class: "ligne-texte" }, App.el("strong", null, "Importer une sauvegarde"), App.el("small", null, "Fusionner ou remplacer"))),
        App.el("button", { type: "button", class: "ligne-action", onclick: exporterTaches },
          App.el("span", { class: "ligne-icone" }, "📄"), App.el("span", { class: "ligne-texte" }, App.el("strong", null, "Exporter les tâches (CSV)"), App.el("small", null, "Pour Excel ou pandas"))),

        App.el("button", { type: "button", class: "ligne-action", onclick: exporterStats },
          App.el("span", { class: "ligne-icone" }, "📊"), App.el("span", { class: "ligne-texte" }, App.el("strong", null, "Exporter les statistiques (CSV)"), App.el("small", null, "Tâches terminées et pomodoros par jour"))),
        App.el("button", { type: "button", class: "ligne-action", onclick: () => App.exporterICS() },
          App.el("span", { class: "ligne-icone" }, "📅"), App.el("span", { class: "ligne-texte" }, App.el("strong", null, "Exporter le calendrier (.ics)"), App.el("small", null, "Pour Google Calendar, Notion Calendar, Apple…")))),
      entree,
    ]);
  }


  /* ---------- Corbeille ---------- */

  function depuis(date) {
    const jours = Math.floor((Date.now() - date) / 864e5);
    if (jours >= 1) return "il y a " + pluriel(jours, "jour");
    const heures = Math.floor((Date.now() - date) / 36e5);
    return heures >= 1 ? "il y a " + heures + " h" : "à l'instant";
  }

  function restaurer(entree) {
    App.etat.corbeille = App.etat.corbeille.filter((e) => e.id !== entree.id);
    if (entree.kind === "page") {
      const page = entree.data;
      if (App.etat.pages.some((p) => p.id === page.id)) page.id = App.id();
      delete App.etat.supprimees[page.id];
      page.maj = Date.now();
      App.etat.pages.push(page);
      App.sauver();
      App.ouvrirPage(page.id);
      App.Toast.afficher("Page restaurée ✅");
    } else {
      const page = App.etat.pages.find((p) => p.id === entree.pageId) || App.page();
      const blocs = entree.data;
      page.blocs.splice(Math.min(entree.index, page.blocs.length), 0, ...blocs);
      App.sauver();
      App.ouvrirPage(page.id);
      App.Toast.afficher(pluriel(blocs.length, "bloc") + " restauré" + (blocs.length > 1 ? "s" : "") + " dans « " + (page.titre || "Sans titre") + " »");
    }
    App.Feuille.fermer();
  }

  function ouvrirCorbeille() {
    const liste = App.etat.corbeille;
    const contenu = [App.el("p", { class: "aide" }, "Les éléments supprimés sont gardés 30 jours.")];

    if (!liste.length) {
      contenu.push(App.el("p", { class: "vide-feuille" }, "La corbeille est vide 🧹"));
    } else {
      contenu.push(App.el("div", { class: "liste-corbeille" }, liste.map((e) => {
        const titre = e.kind === "page"
          ? e.data.icone + " Page « " + (e.data.titre || "Sans titre") + " »"
          : pluriel(e.data.length, "bloc") + " de « " + (e.pageTitre || "Sans titre") + " »";
        const apercu = e.kind === "page"
          ? pluriel(e.data.blocs.length, "bloc")
          : (e.data.map((b) => b.texte).find((t) => t.trim())
            || (e.data.some((b) => b.type === "image" && b.src) ? "🖼 Image" : "")).slice(0, 80);
        return App.el("div", { class: "ligne-corbeille" },
          App.el("div", { class: "corps" }, App.el("strong", null, titre), App.el("small", null, depuis(e.date) + (apercu ? " · " + apercu : ""))),
          App.el("button", { type: "button", class: "btn-secondaire", onclick: () => restaurer(e) }, "Restaurer"),
          App.el("button", { type: "button", class: "btn-icone", "aria-label": "Supprimer définitivement", title: "Supprimer définitivement", onclick: () => {
            App.etat.corbeille = App.etat.corbeille.filter((x) => x.id !== e.id);
            App.sauver();
            ouvrirCorbeille();
          } }, "×"));
      })));
      contenu.push(App.el("div", { class: "actions" },
        App.el("button", { type: "button", class: "btn-danger", onclick: async () => {
          if (await App.Confirmer("Vider la corbeille ? Cette action est définitive.", "Vider")) {
            App.etat.corbeille = [];
            App.sauver();
            ouvrirCorbeille();
          }
        } }, "Vider la corbeille")));
    }
    App.Feuille.ouvrir("Corbeille", contenu);
  }

  // Corbeille : mise en corbeille d'une page (appelée par pages.js)
  App.mettreEnCorbeille = function (page) {
    const id = App.id();
    App.etat.corbeille.unshift({ id: id, kind: "page", date: Date.now(), data: page });
    App.etat.supprimees[page.id] = Date.now();
    return id;
  };
  App.sortirDeCorbeille = function (idCorbeille, idPage) {
    App.etat.corbeille = App.etat.corbeille.filter((e) => e.id !== idCorbeille);
    delete App.etat.supprimees[idPage];
  };


  /* ---------- Statistiques ---------- */

  function serie(donnees, nbJours) {
    const resultat = [];
    for (let i = nbJours - 1; i >= 0; i--) {
      const jour = App.ajouterJours(App.aujourdhui(), -i);
      resultat.push({ jour: jour, valeur: donnees[jour] || 0 });
    }
    return resultat;
  }

  function graphique(points, classe) {
    const max = Math.max(1, ...points.map((p) => p.valeur));
    return App.el("div", { class: "barres " + classe, role: "img", "aria-label": "Graphique des 14 derniers jours" },
      points.map((p) => {
        const nom = new Date(p.jour + "T00:00:00").toLocaleDateString("fr-FR", { weekday: "narrow" });
        const aujourdhui = p.jour === App.aujourdhui();
        return App.el("div", { class: "barre-col" + (aujourdhui ? " auj" : ""), title: App.etiquetteDate(p.jour) + " : " + p.valeur },
          App.el("span", { class: "barre-valeur" }, p.valeur ? String(p.valeur) : ""),
          App.el("span", { class: "barre-haut" }, App.el("i", { style: "height:" + Math.round((p.valeur / max) * 100) + "%" })),
          App.el("span", { class: "barre-nom" }, nom));
      }));
  }

  function serieJours(faits) {
    let n = 0;
    let jour = App.aujourdhui();
    if (!faits[jour]) jour = App.ajouterJours(jour, -1); // la série n'est pas perdue tant que la journée n'est pas finie
    while (faits[jour]) { n++; jour = App.ajouterJours(jour, -1); }
    return n;
  }

  function ouvrirStats() {
    const taches = App.toutesLesTaches();
    const faites = taches.filter(({ bloc }) => bloc.fait).length;
    const retard = taches.filter(({ bloc }) => App.statutDate(bloc) === "retard").length;
    const { faits, pomodoros } = App.etat.stats;
    const total7 = (d) => serie(d, 7).reduce((n, p) => n + p.valeur, 0);

    const carte = (valeur, nom, classe) => App.el("div", { class: "carte-stat " + (classe || "") },
      App.el("strong", null, String(valeur)), App.el("span", null, nom));

    const tags = Object.entries(App.tousLesTags()).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const maxTag = tags.length ? tags[0][1] : 1;

    const pages = App.etat.pages
      .map((p) => ({ p: p, n: p.blocs.filter((b) => b.type === "tache").length, f: p.blocs.filter((b) => b.type === "tache" && b.fait).length }))
      .filter((x) => x.n > 0);

    App.Feuille.ouvrir("Statistiques", [
      App.el("div", { class: "cartes-stats" },
        carte(faites + " / " + taches.length, "tâches terminées"),
        carte(total7(faits), "terminées cette semaine"),
        carte(serieJours(faits) + " 🔥", "jours d'affilée"),
        carte(retard, "en retard", retard ? "alerte" : ""),
        carte(total7(pomodoros), "pomodoros cette semaine"),
        carte(App.etat.pages.length, "pages")),
      App.el("h3", { class: "titre-section" }, "Tâches terminées (14 jours)"),
      graphique(serie(faits, 14), "b-taches"),
      App.el("h3", { class: "titre-section" }, "Pomodoros (14 jours)"),
      graphique(serie(pomodoros, 14), "b-pomo"),
      pages.length ? App.el("h3", { class: "titre-section" }, "Avancement par page") : null,
      pages.map(({ p, n, f }) => App.el("div", { class: "ligne-avancement" },
        App.el("span", { class: "nom" }, p.icone + " " + (p.titre || "Sans titre")),
        App.el("span", { class: "rail" }, App.el("i", { style: "width:" + Math.round((f / n) * 100) + "%" })),
        App.el("span", { class: "chiffre" }, f + "/" + n))),
      tags.length ? App.el("h3", { class: "titre-section" }, "Tags les plus utilisés") : null,
      tags.map(([t, n]) => App.el("div", { class: "ligne-avancement" },
        App.el("span", { class: "nom" }, "#" + t),
        App.el("span", { class: "rail" }, App.el("i", { style: "width:" + Math.round((n / maxTag) * 100) + "%" })),
        App.el("span", { class: "chiffre" }, String(n)))),
      App.el("div", { class: "actions" },
        App.el("button", { type: "button", class: "btn-secondaire", onclick: exporterStats }, "Exporter en CSV")),
    ], { large: true });
  }


  /* ---------- Utilisé par le menu Paramètres ---------- */

  App.Donnees = { stats: ouvrirStats, corbeille: ouvrirCorbeille, sauvegarde: ouvrirSauvegarde };
})();

</script>
  <script>
"use strict";

/* =====================================================
   focus.js : mode concentration et minuteur Pomodoro
   Travail, puis pause, en alternance. Chaque travail terminé compte dans les statistiques.
   ===================================================== */

(function () {
  const $ = (id) => document.getElementById(id);
  const panneau = $("pomodoro");
  const affichage = $("pomo-temps");
  const libelle = $("pomo-mode");
  const boutonDemarrer = $("pomo-demarrer");
  const choix = $("pomo-duree");
  const compte = $("pomo-compte");
  const titreOriginal = document.title;

  const PRESETS = { "25-5": [25, 5], "50-10": [50, 10], "15-3": [15, 3] };
  const CLE = "mes-blocs-pomodoro";

  let preset = "25-5";
  try {
    const sauve = localStorage.getItem(CLE);
    if (sauve && PRESETS[sauve]) preset = sauve;
  } catch (erreur) { /* stockage indisponible */ }
  choix.value = preset;

  let mode = "travail";    // "travail" ou "pause"
  let enCours = false;
  let fin = 0;             // heure de fin (ms) quand le minuteur tourne
  let restant = PRESETS[preset][0] * 60000;
  let intervalle = null;

  const duree = (m) => PRESETS[preset][m === "travail" ? 0 : 1] * 60000;
  const mmss = (ms) => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };

  function afficher() {
    affichage.textContent = mmss(restant);
    libelle.textContent = mode === "travail" ? "🎯 Travail" : "☕ Pause";
    panneau.dataset.mode = mode;
    boutonDemarrer.textContent = enCours ? "⏸ Pause" : "▶ Démarrer";
    compte.textContent = (App.etat.stats.pomodoros[App.aujourdhui()] || 0) + " aujourd'hui";
    panneau.hidden = !(enCours || document.body.classList.contains("focus"));
    document.title = enCours ? "(" + mmss(restant) + ") " + titreOriginal : titreOriginal;
    // Le titre de la page est géré ailleurs : on le restaure à l'arrêt
    if (!enCours && App.afficherEntete) App.afficherEntete();
  }

  function bip() {
    try {
      const Contexte = window.AudioContext || window.webkitAudioContext;
      const ctx = new Contexte();
      [0, 0.28, 0.56].forEach((retard) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + retard);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + retard + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + retard + 0.22);
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + retard);
        o.stop(ctx.currentTime + retard + 0.25);
      });
      setTimeout(() => ctx.close(), 1500);
    } catch (erreur) { /* pas de son : tant pis */ }
  }

  function terminer() {
    arreter();
    const etaitTravail = mode === "travail";
    if (etaitTravail) {
      App.compter("pomodoros", 1);
      App.sauver();
    }
    mode = etaitTravail ? "pause" : "travail";
    restant = duree(mode);
    bip();
    const message = etaitTravail ? "Bravo ! Pause de " + PRESETS[preset][1] + " min ☕" : "La pause est finie : au travail 🎯";
    App.Toast.afficher(message, { duree: 8000 });
    if (App.etat.reglages.rappels && "Notification" in window && Notification.permission === "granted" && "serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistration().then((r) => r && r.showNotification("Pomodoro", { body: message, icon: "icons/icon-192.png", tag: "pomodoro" })).catch(() => {});
    }
    afficher();
  }

  function tic() {
    restant = fin - Date.now();
    if (restant <= 0) { terminer(); return; }
    afficher();
  }

  function demarrer() {
    if (enCours) return;
    enCours = true;
    fin = Date.now() + restant;
    intervalle = setInterval(tic, 250);
    afficher();
  }

  function arreter() {
    enCours = false;
    clearInterval(intervalle);
    intervalle = null;
  }

  function pause() {
    if (!enCours) return;
    restant = fin - Date.now();
    arreter();
    afficher();
  }

  boutonDemarrer.addEventListener("click", () => (enCours ? pause() : demarrer()));

  $("pomo-reset").addEventListener("click", () => {
    arreter();
    restant = duree(mode);
    afficher();
  });

  $("pomo-passer").addEventListener("click", () => {
    arreter();
    mode = mode === "travail" ? "pause" : "travail";
    restant = duree(mode);
    afficher();
  });

  choix.addEventListener("change", () => {
    preset = choix.value;
    try { localStorage.setItem(CLE, preset); } catch (erreur) { /* ignoré */ }
    arreter();
    restant = duree(mode);
    afficher();
  });


  /* ---------- Mode focus : on cache tout sauf la page ---------- */

  function basculerFocus(actif) {
    const veut = typeof actif === "boolean" ? actif : !document.body.classList.contains("focus");
    document.body.classList.toggle("focus", veut);
    document.body.classList.remove("menu-ouvert");
    $("btn-focus").setAttribute("aria-pressed", String(veut));
    $("btn-focus").textContent = veut ? "✕ Quitter le focus" : "🎯 Focus";
    afficher();
  }

  $("btn-focus").addEventListener("click", () => basculerFocus());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.body.classList.contains("focus") && !document.querySelector("dialog[open]") && $("menu-bloc").hidden && $("menu-types").hidden) {
      basculerFocus(false);
    }
  });

  // Si on change de page pendant un focus, on reste en focus. En vue (Aujourd'hui…), on le quitte.
  afficher();
  App.Pomodoro = { rafraichir: afficher };
})();

</script>

/* =====================================================

(function () {
