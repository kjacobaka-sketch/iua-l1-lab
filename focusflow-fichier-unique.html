  };
  let dejaComplet = false;


  /* ---------- En-tête de la page ---------- */

  // Favori et options de la page
  btnFavori.addEventListener("click", () => App.basculerFavori());
  btnOptions.addEventListener("click", () => App.MenuPage.ouvrir());

  App.basculerFavori = function (id) {
    const page = id ? App.etat.pages.find((p) => p.id === id) : App.page();
    if (!page) return;
    page.favori = !page.favori;
    App.sauver();
    App.afficherEntete();
    App.afficherPages();
    App.Toast.afficher(page.favori ? "Ajoutée aux favoris ⭐" : "Retirée des favoris");
  };

  App.afficherEntete = function () {
    const page = App.page();
    document.body.dataset.couleur = page.couleur;
    iconePage.textContent = page.icone;
    titrePage.textContent = page.titre;
    document.title = (page.titre || "Sans titre") + " · FocusFlow";
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", COULEUR_THEME[page.couleur]);
    btnFavori.setAttribute("aria-pressed", String(!!page.favori));
    btnFavori.querySelector(".etoile").textContent = page.favori ? "★" : "☆";
    btnFavori.title = page.favori ? "Retirer des favoris" : "Mettre en favori";
  };

  // Un toucher sur l'icône en choisit une autre
  iconePage.addEventListener("click", () => {
    const page = App.page();
    const i = App.ICONES.indexOf(page.icone);
    page.icone = App.ICONES[(i + 1) % App.ICONES.length];
    App.sauver();
    iconePage.textContent = page.icone;
    iconePage.classList.remove("rebond");
    void iconePage.offsetWidth;
    iconePage.classList.add("rebond");
    App.afficherPages();
  });

  titrePage.addEventListener("input", () => {
    App.page().titre = titrePage.textContent;
    document.title = (App.page().titre || "Sans titre") + " · FocusFlow";
    App.sauver();
    App.afficherPages();
  });
  titrePage.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const premier = zonePage.querySelector(".champ");
      if (premier) premier.focus();
    }
  });


  /* ---------- Barre de progression des tâches ---------- */

  App.majProgres = function (animer) {
    const taches = App.page().blocs.filter((b) => b.type === "tache");
    const faits = taches.filter((b) => b.fait).length;
    const zone = $("progres");
    const pct = taches.length ? Math.round((faits / taches.length) * 100) : 0;
    const complet = taches.length > 0 && faits === taches.length;

    zone.hidden = taches.length === 0;
    $("progres-rempli").style.width = pct + "%";
    $("progres-texte").textContent = taches.length
      ? faits + " / " + taches.length + " tâche" + (taches.length > 1 ? "s" : "") + (complet ? " · bravo 🎉" : "")
      : "";
    zone.classList.toggle("complet", complet);

    if (complet && !dejaComplet && animer) App.confettis($("progres-rempli"), 30);
    dejaComplet = complet;
  };


  /* ---------- Liste des pages ---------- */

  App.afficherPages = function () {
    const q = App.simplifier(recherche.value);
    const courante = App.page().id;
    const pages = App.etat.pages.filter((p) =>
      !q || App.simplifier(p.titre).includes(q) || p.blocs.some((b) => App.simplifier(b.texte).includes(q))
    );

    const favoris = pages.filter((p) => p.favori);
    $("bloc-favoris").hidden = favoris.length === 0;
    listeFavoris.replaceChildren(...favoris.map((p) => ligne(p, courante)));

    if (pages.length === 0) {
      const vide = document.createElement("p");
      vide.className = "vide";
      vide.textContent = "Aucune page trouvée";
      listePages.replaceChildren(vide);
      return;
    }
    listePages.replaceChildren(...pages.map((p) => ligne(p, courante)));
  };

  // Une ligne du menu latéral
  function ligne(p, courante) {
    const ligne = document.createElement("div");
    ligne.className = "page-item" + (p.id === courante && !App.Vues.active() ? " actif" : "");

    const ouvrir = document.createElement("button");
    ouvrir.type = "button";
    ouvrir.className = "page-ouvrir";
    const point = document.createElement("span");
    point.className = "point";
    point.dataset.c = p.couleur;
    const icone = document.createElement("span");
    icone.className = "page-icone";
    icone.textContent = p.icone;
    const nom = document.createElement("span");
    nom.className = "page-nom";
    nom.textContent = p.titre || "Sans titre";
    ouvrir.append(point, icone, nom);
    ouvrir.addEventListener("click", () => App.ouvrirPage(p.id));

    const supprimer = document.createElement("button");
    supprimer.type = "button";
    supprimer.className = "page-supprimer";
    supprimer.textContent = "×";
    supprimer.setAttribute("aria-label", "Supprimer la page « " + (p.titre || "Sans titre") + " »");
    supprimer.addEventListener("click", () => App.supprimerPage(p.id));

    ligne.append(ouvrir, supprimer);
    return ligne;
  }

  App.ouvrirPage = function (id, animer) {
    const page = App.etat.pages.find((p) => p.id === id) || App.etat.pages[0];
    App.Vues.fermer();
    App.effacerRecherche();
    recherchePage.value = "";
    App.majCompteurRecherche(null);
    App.etat.courante = page.id;
    App.sauver();

    App.Toast.fermer();
    App.MenuTypes.fermer();
    App.MenuBloc.fermer();
    App.afficherEntete();
    App.afficherBlocs(null);
    App.majProgres(false);
    App.afficherPages();
    fermerLateral();
    window.scrollTo(0, 0);

    if (animer !== false && !App.mouvementReduit()) {
      zonePage.classList.remove("change");
      void zonePage.offsetWidth;
      zonePage.classList.add("change");
    }
  };

  App.creerPage = function () {
    const nombre = App.etat.pages.length;
    const page = App.nouvellePage(
      "",
      App.COULEURS_PAGE[nombre % App.COULEURS_PAGE.length],
      App.ICONES[nombre % App.ICONES.length]
    );
    App.etat.pages.push(page);
    recherche.value = "";
    App.ouvrirPage(page.id);
    titrePage.focus();
  };

  App.supprimerPage = function (id) {
    const pages = App.etat.pages;
    const i = pages.findIndex((p) => p.id === id);
    if (i === -1) return;
    const page = pages[i];
    const etaitCourante = App.page().id === id;

    pages.splice(i, 1);
    const idCorbeille = App.mettreEnCorbeille(page); // gardée 30 jours, et notée comme supprimée pour la synchronisation
    let remplacante = null;
    if (pages.length === 0) {
      remplacante = App.nouvellePage();
      pages.push(remplacante);
    }

    if (etaitCourante || remplacante) {
      App.ouvrirPage((pages[i] || pages[i - 1] || pages[0]).id);
    } else {
      App.sauver();
      App.afficherPages();
    }

    App.Toast.afficher("Page supprimée", {
      action: "Annuler",
      surAction: () => {
        App.sortirDeCorbeille(idCorbeille, page.id);
        page.maj = Date.now();
        if (remplacante) pages.splice(pages.indexOf(remplacante), 1);
        pages.splice(Math.min(i, pages.length), 0, page);
        App.ouvrirPage(page.id);
      },
    });
  };


  /* ---------- Menu latéral (tiroir sur mobile) ---------- */

  function ouvrirLateral() { document.body.classList.add("menu-ouvert"); }
  function fermerLateral() { document.body.classList.remove("menu-ouvert"); }

  $("ouvrir-menu").addEventListener("click", ouvrirLateral);
  $("voile").addEventListener("click", fermerLateral);
  $("nouvelle-page").addEventListener("click", () => App.Modeles.ouvrir());

  // Recherche dans la page
  recherchePage.addEventListener("input", () => App.rechercherDansPage(recherchePage.value));
  recherchePage.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      recherchePage.value = "";
      App.rechercherDansPage("");
      recherchePage.blur();
    }
  });
  App.majCompteurRecherche = function (n) {
    compteurRecherche.textContent = n === null ? "" : n + " résultat" + (n > 1 ? "s" : "");
  };
  recherche.addEventListener("input", App.afficherPages);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") fermerLateral();
  });
})();

</script>
  <script>
"use strict";

/* =====================================================
   menupage.js : le menu « Options » de chaque page
   Couleur, icône, favori, dupliquer, partager, supprimer
   ===================================================== */

App.MenuPage = (function () {
  const NOMS_COULEURS = { violet: "Indigo", bleu: "Bleu", vert: "Vert", orange: "Orange", rose: "Rose", turquoise: "Turquoise" };

  /* ---------- Le texte de la page (pour partager ou exporter) ---------- */

  function texteDePage(page) {
    const lignes = [];
    let numero = 0;
    const titre = page.titre || "Sans titre";
    lignes.push("# " + page.icone + " " + titre, "");

    page.blocs.forEach((b) => {
      numero = b.type === "numerotee" ? numero + 1 : 0;
      const marge = "  ".repeat(b.niveau || 0);
      const t = b.texte || "";
      let l;
      switch (b.type) {
        case "titre": l = "## " + t; break;
        case "sous_titre": l = "### " + t; break;
        case "tache": {
          l = marge + "- [" + (b.fait ? "x" : " ") + "] " + t;
          if (b.echeance) l += " (échéance : " + b.echeance + (b.heure ? " " + b.heure : "") + ")";
          if (b.tags && b.tags.length) l += " " + b.tags.map((x) => "#" + x).join(" ");
          break;
        }
        case "liste": l = marge + "- " + t; break;
        case "numerotee": l = marge + numero + ". " + t; break;
        case "citation": l = "> " + t; break;
        case "image": l = "_[Image" + (t ? " : " + t : "") + "]_"; break;
        case "separateur": l = "---"; break;
        default: l = marge + t;
      }
      lignes.push(l);
    });
    return lignes.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
  }
  App.texteDePage = texteDePage;

  function nomFichier(page) {
    const base = (page.titre || "page").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase();
    return (base || "page") + ".md";
  }


  /* ---------- Actions ---------- */

  async function copier(texte) {
    try {
      await navigator.clipboard.writeText(texte);
      return true;
    } catch (erreur) {
      // plan B pour les navigateurs qui refusent l'API moderne
      try {
        const zone = App.el("textarea", { style: "position:fixed;opacity:0;top:0;left:0" });
        zone.value = texte;
        document.body.append(zone);
        zone.select();
        const ok = document.execCommand("copy");
        zone.remove();
        return ok;
      } catch (e2) { return false; }
    }
  }

  async function partager(page) {
    const texte = texteDePage(page);
    try {
      await navigator.share({ title: page.titre || "Sans titre", text: texte });
    } catch (erreur) {
      if (erreur && erreur.name === "AbortError") return;   // la personne a annulé : rien à dire
      if (await copier(texte)) App.Toast.afficher("Partage impossible ici : texte copié à la place");
      else App.Toast.afficher("Le partage n'est pas disponible sur cet appareil");
    }
  }

  function envoyerParMail(page) {
    let corps = texteDePage(page);
    if (corps.length > 1800) corps = corps.slice(0, 1800) + "\n…";
    window.location.href = "mailto:?subject=" + encodeURIComponent(page.titre || "Sans titre") + "&body=" + encodeURIComponent(corps);
  }

  function dupliquerPage(page) {
    const copie = JSON.parse(JSON.stringify(page));
    copie.id = App.id();
    copie.titre = (page.titre || "Sans titre") + " (copie)";
    copie.favori = false;
    copie.maj = Date.now();
    copie.blocs.forEach((b) => { b.id = App.id(); b.rappele = ""; });
    const pages = App.etat.pages;
    pages.splice(pages.indexOf(page) + 1, 0, copie);
    App.Feuille.fermer();
    App.ouvrirPage(copie.id);
    App.Toast.afficher("Page dupliquée");
  }


  /* ---------- Le menu ---------- */

  function ligne(icone, titre, sousTitre, action, danger) {
    return App.el("button", { type: "button", class: "ligne-action" + (danger ? " danger" : ""), onclick: action },
      App.el("span", { class: "ligne-icone" }, icone),
      App.el("span", { class: "ligne-texte" }, App.el("strong", null, titre), sousTitre ? App.el("small", null, sousTitre) : null),
      App.el("span", { class: "ligne-droite" }, "›"));
  }

  function section(titre, ...contenu) {
    return App.el("section", { class: "param-section" }, App.el("h3", { class: "titre-section" }, titre), ...contenu);
  }

  /* ---------- Lien de partage en lecture seule (demande le serveur) ---------- */

  async function lienDePartage(page) {
    if (!App.Sync.connecte()) {
      App.Toast.afficher("Pour créer un lien, connecte d'abord la synchronisation (Paramètres)");
      return;
    }
    if (location.protocol === "file:" && !App.Sync.adresse().startsWith("http")) {
      App.Toast.afficher("Renseigne l'adresse du serveur dans la synchronisation");
      return;
    }
    App.Feuille.ouvrir("Lien de partage", [App.el("p", { class: "aide" }, "⏳ Création du lien…")]);
    try {
      await App.Sync.synchroniser(false);          // la version du serveur doit contenir la page à jour
      const r = await App.Sync.appel("POST", "/partages", { page_id: page.id });
      if (r.statut !== 200) throw new Error((r.donnees && r.donnees.detail) || "Erreur " + r.statut);
      const adresse = App.Sync.adresse() + r.donnees.chemin;
      const champ = App.el("input", { type: "text", readonly: true, value: adresse, "aria-label": "Lien de partage", onfocus: () => champ.select() });
      App.Feuille.ouvrir("Lien de partage", [
        App.el("p", { class: "aide" }, "Toute personne qui a ce lien peut LIRE la page « " + (page.titre || "Sans titre") + " » (sans compte, sans pouvoir la modifier). Le lien montre toujours la dernière version synchronisée."),
        App.el("div", { class: "champ-form" }, champ),
        App.el("div", { class: "actions" },
          App.el("button", { type: "button", class: "btn-primaire", onclick: async () => {
            if (typeof navigator.share === "function") {
              try { await navigator.share({ title: page.titre || "Sans titre", url: adresse }); return; } catch (e) { if (e && e.name === "AbortError") return; }
            }
            App.Toast.afficher((await copier(adresse)) ? "Lien copié ✓" : "Copie impossible : sélectionne le lien");
          } }, typeof navigator.share === "function" ? "📤 Envoyer le lien" : "📋 Copier le lien"),
          App.el("button", { type: "button", class: "btn-danger", onclick: async () => {
            if (!(await App.Confirmer("Désactiver ce lien ? Les personnes qui l'ont ne pourront plus voir la page.", "Désactiver"))) return;
            const d = await App.Sync.appel("DELETE", "/partages/" + r.donnees.jeton);
            App.Toast.afficher(d.statut === 200 ? "Lien désactivé" : "Impossible de désactiver pour l'instant");
            if (d.statut === 200) App.Feuille.fermer();
          } }, "Désactiver le lien")),
      ]);
    } catch (erreur) {
      App.Feuille.ouvrir("Lien de partage", [App.el("p", { class: "erreur-form" }, erreur instanceof TypeError ? "Serveur injoignable (hors ligne ?)" : erreur.message)]);
    }
  }

  function ouvrir() {
    if (App.Vues.active()) return;   // les vues (Aujourd'hui…) ne sont pas des pages
    const page = App.page();
    const taches = page.blocs.filter((b) => b.type === "tache");
    const faites = taches.filter((b) => b.fait).length;

    const resume = App.el("div", { class: "resume-page" },
      App.el("span", { class: "resume-icone" }, page.icone),
      App.el("div", null,
        App.el("strong", null, page.titre || "Sans titre"),
        App.el("small", null, taches.length ? faites + " / " + taches.length + " tâche" + (taches.length > 1 ? "s" : "") + " terminée" + (faites > 1 ? "s" : "") : "Aucune tâche")));

    const couleurs = App.el("div", { class: "couleurs", role: "group", "aria-label": "Couleur de la page" },
      App.COULEURS_PAGE.map((c) => App.el("button", {
        type: "button", class: "pastille" + (page.couleur === c ? " choisie" : ""), "data-c": c,
        title: NOMS_COULEURS[c], "aria-label": "Couleur " + NOMS_COULEURS[c],
        onclick: () => {
          page.couleur = c;
          App.sauver();
          App.afficherEntete();
          App.afficherPages();
          ouvrir();
        },
      })));

    const icones = App.el("div", { class: "icones", role: "group", "aria-label": "Icône de la page" },
      App.ICONES.map((i) => App.el("button", {
        type: "button", class: "choix-icone" + (page.icone === i ? " choisie" : ""), "aria-label": "Icône " + i,
        onclick: () => {
          page.icone = i;
          App.sauver();
          App.afficherEntete();
          App.afficherPages();
          ouvrir();
        },
      }, i)));

    const peutPartager = typeof navigator.share === "function";

    App.Feuille.ouvrir("Options de la page", [
      resume,

      section("Apparence",
        App.el("div", { class: "champ-form" }, App.el("label", null, "Couleur"), couleurs),
        App.el("div", { class: "champ-form" }, App.el("label", null, "Icône"), icones)),

      section("Organiser",
        ligne(page.favori ? "★" : "☆", page.favori ? "Retirer des favoris" : "Mettre en favori", "Les favoris restent en haut du menu des pages", () => {
          App.basculerFavori();
          ouvrir();
        }),
        ligne("⧉", "Dupliquer la page", "Crée une copie avec tous les blocs", () => dupliquerPage(page))),

      section("Partager",
        peutPartager ? ligne("📤", "Partager…", "Messages, WhatsApp, e-mail… (menu de ton appareil)", () => partager(page)) : null,
        ligne("🔗", "Lien de partage (lecture seule)", App.Sync.connecte() ? "Une page web que tu peux désactiver à tout moment" : "Demande la synchronisation (Paramètres)", () => lienDePartage(page)),
        ligne("📋", "Copier le texte", "Pour le coller où tu veux", async () => {
          App.Toast.afficher((await copier(texteDePage(page))) ? "Texte copié ✓" : "Copie impossible ici");
        }),
        ligne("✉️", "Envoyer par e-mail", "Ouvre ton application de messagerie", () => envoyerParMail(page)),
        ligne("⬇️", "Télécharger (.md)", "Un fichier texte lisible partout", () => {
          App.telecharger(nomFichier(page), texteDePage(page), "text/markdown;charset=utf-8");
          App.Toast.afficher("Fichier téléchargé");
        }),
        ligne("🖨️", "Imprimer ou enregistrer en PDF", null, () => {
          App.Feuille.fermer();
          setTimeout(() => window.print(), 250);
        }),
        App.el("p", { class: "aide petit" }, "Le partage envoie une copie du texte. Pour retrouver tes pages sur plusieurs appareils, utilise plutôt la synchronisation (Paramètres).")),

      section("Zone sensible",
        ligne("🗑", "Supprimer la page", "Elle reste 30 jours dans la corbeille", () => {
          App.Feuille.fermer();
          App.supprimerPage(page.id);
        }, true)),
    ]);
  }

  return { ouvrir: ouvrir };
})();

</script>
  <script>
"use strict";

/* =====================================================
   recherche.js : recherche dans tous les blocs de toutes les pages
   Taper dans « Rechercher » filtre les pages (par leur nom) et liste
   aussi les blocs qui contiennent le texte. Ctrl+K (ou Cmd+K) y va directement.
   ===================================================== */

(function () {
  const champ = document.getElementById("recherche");
  const zone = document.getElementById("resultats-recherche");
  const MAX = 30;

  function extrait(texte, q) {
    const brut = texte.replace(/\s+/g, " ").trim();
    const i = App.simplifier(brut).indexOf(q);
    if (i < 0) return [brut.slice(0, 90)];
    const debut = Math.max(0, i - 24);
    const fin = Math.min(brut.length, i + q.length + 50);
    return [(debut > 0 ? "…" : "") + brut.slice(debut, i), brut.slice(i, i + q.length), brut.slice(i + q.length, fin) + (fin < brut.length ? "…" : "")];
  }

  function chercher() {
    const q = App.simplifier(champ.value.trim());
    if (q.length < 2) { zone.hidden = true; zone.replaceChildren(); return; }

    const trouves = [];
    let total = 0;
    App.etat.pages.forEach((page) => {
      page.blocs.forEach((bloc) => {
        if (bloc.type === "separateur" || !bloc.texte) return;
        if (App.simplifier(bloc.texte).includes(q)) {
          total++;
          if (trouves.length < MAX) trouves.push({ page: page, bloc: bloc });
        }
      });
    });

    zone.hidden = false;
    if (!trouves.length) {
      zone.replaceChildren(App.el("p", { class: "section-titre" }, "Dans les blocs"), App.el("p", { class: "vide" }, "Aucun bloc ne contient « " + champ.value.trim() + " »"));
      return;
    }
    zone.replaceChildren(
      App.el("p", { class: "section-titre" }, "Dans les blocs · " + total),
      ...trouves.map(({ page, bloc }) => {
        const [avant, milieu, apres] = extrait(bloc.texte, q);
        return App.el("button", {
          type: "button", class: "resultat", "data-bloc": bloc.id,
          onclick: () => {
            App.ouvrirPage(page.id);
            chercher();      // la recherche a été vidée en ouvrant la page : on masque les résultats
            document.body.classList.remove("menu-ouvert");
            setTimeout(() => App.focaliser(bloc.id, "fin"), 80);
          },
        },
          App.el("span", { class: "resultat-page" }, page.icone + " " + (page.titre || "Sans titre")),
          App.el("span", { class: "resultat-texte" }, avant, milieu !== undefined ? App.el("mark", null, milieu) : null, apres || ""));
      }),
      total > MAX ? App.el("p", { class: "vide" }, "… et " + (total - MAX) + " autres") : null);
  }

  champ.addEventListener("input", chercher);
  // les résultats suivent aussi les modifications (une tâche renommée, une page supprimée…)
  let minuteur = null;
  App.ecouteurs.push(() => { clearTimeout(minuteur); minuteur = setTimeout(chercher, 400); });

  // Ctrl+K / Cmd+K : aller à la recherche
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {

/* =====================================================
   vuesplus.js : la vue « Tableau » (Kanban) et la vue « Calendrier »

App.VuesPlus = (function () {
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const JOURS = ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"];

  /* ---------- Tableau : À faire / En cours / Terminé ---------- */

  const COLONNES = [
    { cle: "afaire", titre: "À faire", icone: "📋" },
    { cle: "encours", titre: "En cours", icone: "⏳" },
    { cle: "fait", titre: "Terminé", icone: "✅" },
  ];
  const MAX_TERMINEES = 30;

  const statutDe = (bloc) => (bloc.fait ? "fait" : bloc.encours ? "encours" : "afaire");

  // Change le statut d'une tâche : à faire, en cours ou fait
  function definirStatut(bloc, statut) {
    if (statutDe(bloc) === statut) return;
    if (statut === "fait") {
      App.basculerTache(bloc, App.Vues.rafraichir);   // coche (et gère sous-tâches, répétition, statistiques)
    } else {
      if (bloc.fait) App.basculerTache(bloc, App.Vues.rafraichir);
      bloc.encours = statut === "encours";
      App.sauver();
    }
    App.Vues.rafraichir();
  }

  function carte(page, bloc) {
    const statut = statutDe(bloc);
    const segment = COLONNES.map((c) => App.el("button", {
      type: "button",
      class: "etat" + (statut === c.cle ? " actif" : ""),
      "aria-pressed": String(statut === c.cle),
      title: c.titre,
      onclick: () => definirStatut(bloc, c.cle),
    }, c.icone));

    const prog = App.progression(bloc);
    return App.el("article", { class: "carte-tache" + (bloc.fait ? " fait" : ""), "data-statut": statut },
      App.el("button", {
        type: "button", class: "carte-texte", title: "Ouvrir la page",
        onclick: () => { App.ouvrirPage(page.id); setTimeout(() => App.focaliser(bloc.id, "fin"), 60); },
      }, bloc.texte || "Tâche sans titre"),
      App.el("div", { class: "meta" },
        App.el("span", { class: "chip page-chip" }, page.icone + " " + (page.titre || "Sans titre")),
        prog ? App.el("span", { class: "chip progression" }, prog.faits + "/" + prog.total) : null,
        bloc.echeance ? App.el("span", { class: "chip date " + App.statutDate(bloc) }, "📅 " + App.etiquetteDate(bloc.echeance, bloc.heure)) : null),
      App.el("div", { class: "etats", role: "group", "aria-label": "Statut de la tâche" }, segment));
  }

  function tableau() {
    const toutes = App.toutesLesTaches();
    const parColonne = { afaire: [], encours: [], fait: [] };
    toutes.forEach((t) => parColonne[statutDe(t.bloc)].push(t));
    const parDate = (a, b) => (a.bloc.echeance || "9999").localeCompare(b.bloc.echeance || "9999");
    parColonne.afaire.sort(parDate);
    parColonne.encours.sort(parDate);
    parColonne.fait.sort((a, b) => (b.bloc.faitLe || 0) - (a.bloc.faitLe || 0));

    const colonnes = COLONNES.map((c) => {
      const liste = parColonne[c.cle];
      const visibles = c.cle === "fait" ? liste.slice(0, MAX_TERMINEES) : liste;

        liste.length > visibles.length ? App.el("p", { class: "colonne-vide" }, "… et " + (liste.length - visibles.length) + " autres") : null);
    });

    const total = toutes.length;
    return {
      icone: "▦",
      nom: "Tableau",
      sousTitre: total ? parColonne.afaire.length + " à faire · " + parColonne.encours.length + " en cours · " + parColonne.fait.length + (parColonne.fait.length > 1 ? " terminées" : " terminée") : "Aucune tâche pour le moment",
      contenu: App.el("div", { class: "tableau" }, colonnes),
    };
  }


  /* ---------- Calendrier ---------- */

  let affiche = null;      // { annee, mois } du mois affiché
  let jourChoisi = null;   // « AAAA-MM-JJ »

  function aujourdhui() { return App.aujourdhui(); }

  function calendrier() {
    if (!affiche) {
      const d = new Date();
      affiche = { annee: d.getFullYear(), mois: d.getMonth() };
      jourChoisi = aujourdhui();
    }
    const { annee, mois } = affiche;
    const toutes = App.toutesLesTaches().filter((t) => t.bloc.echeance);
    const parJour = {};
    toutes.forEach((t) => { (parJour[t.bloc.echeance] = parJour[t.bloc.echeance] || []).push(t); });
    const sansDate = App.toutesLesTaches().filter((t) => !t.bloc.echeance && !t.bloc.fait).length;

    // Grille : la semaine commence le lundi
    const premier = new Date(annee, mois, 1);
    const decalage = (premier.getDay() + 6) % 7;
    const nbJours = new Date(annee, mois + 1, 0).getDate();
    const cases = [];
    for (let i = 0; i < decalage; i++) cases.push(App.el("span", { class: "jour vide", "aria-hidden": "true" }));
    for (let n = 1; n <= nbJours; n++) {
      const iso = App.iso(new Date(annee, mois, n));
      const taches = parJour[iso] || [];
      const restantes = taches.filter((t) => !t.bloc.fait).length;
      const classes = ["jour"];
      if (iso === aujourdhui()) classes.push("aujourdhui");
      if (iso === jourChoisi) classes.push("choisi");
      if (taches.length) classes.push(restantes ? (iso < aujourdhui() ? "en-retard" : "avec") : "toutes-faites");
      cases.push(App.el("button", {
        type: "button", class: classes.join(" "), "data-jour": iso,
        "aria-label": n + " " + MOIS[mois] + (taches.length ? ", " + taches.length + " tâche" + (taches.length > 1 ? "s" : "") : ""),
        "aria-pressed": String(iso === jourChoisi),
        onclick: () => { jourChoisi = iso; App.Vues.rafraichir(); },
      }, App.el("span", { class: "jour-num" }, String(n)), taches.length ? App.el("span", { class: "jour-points" }, taches.slice(0, 3).map(() => App.el("i")), taches.length > 3 ? "+" : "") : null));
    }

    const aller = (delta) => {
      const d = new Date(annee, mois + delta, 1);
      affiche = { annee: d.getFullYear(), mois: d.getMonth() };
      App.Vues.rafraichir();
    };

    const entete = App.el("div", { class: "cal-entete" },
      App.el("button", { type: "button", class: "btn-page", "aria-label": "Mois précédent", onclick: () => aller(-1) }, "‹"),
      App.el("h2", { class: "cal-titre" }, MOIS[mois] + " " + annee),
      App.el("button", { type: "button", class: "btn-page", "aria-label": "Mois suivant", onclick: () => aller(1) }, "›"),
      App.el("button", { type: "button", class: "btn-page", onclick: () => { const d = new Date(); affiche = { annee: d.getFullYear(), mois: d.getMonth() }; jourChoisi = aujourdhui(); App.Vues.rafraichir(); } }, "Aujourd'hui"),
      App.el("button", { type: "button", class: "btn-page", title: "Exporter les tâches datées au format .ics", onclick: () => App.exporterICS && App.exporterICS() }, "📅 .ics"));

    // Les tâches du jour choisi
    const duJour = (parJour[jourChoisi] || []).slice().sort((a, b) => (a.bloc.fait - b.bloc.fait) || (a.bloc.heure || "99").localeCompare(b.bloc.heure || "99"));
    const [aa, mm, jj] = jourChoisi.split("-").map(Number);
    const titreJour = App.el("h3", { class: "cal-jour-titre" }, jj + " " + MOIS[mm - 1] + (jourChoisi === aujourdhui() ? " · aujourd'hui" : ""));
    const liste = duJour.length
      ? App.el("div", { class: "vue-liste" }, duJour.map((t) => App.Vues.ligneTache(t.page, t.bloc)))
      : App.el("p", { class: "vue-vide" }, "Aucune tâche ce jour-là.");

    return {
      icone: "🗓️",
      nom: "Calendrier",
      sousTitre: sansDate ? sansDate + " tâche" + (sansDate > 1 ? "s" : "") + " sans date (ajoute-en une avec 📅)" : "Toutes tes tâches ont une date",
      contenu: App.el("div", { class: "calendrier" },
        entete,
        App.el("div", { class: "cal-semaine", "aria-hidden": "true" }, JOURS.map((j) => App.el("span", null, j))),
        App.el("div", { class: "cal-grille" }, cases),
        titreJour,
        liste),
    };
  }

  return { tableau: tableau, calendrier: calendrier };
})();

/* =====================================================
   images.js : les blocs « Image »
   La photo est réduite (1280 px au plus, JPEG) puis rangée dans la page,
   pour que l'appli marche hors ligne et se synchronise comme le reste.
   ===================================================== */

// Réduit une image et renvoie ses données (« data URL »)
App.lireImage = function (fichier) {
  return new Promise((resolve, reject) => {
    if (!fichier || !/^image\//.test(fichier.type)) { reject(new Error("Ce fichier n'est pas une image")); return; }
    const url = URL.createObjectURL(fichier);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const LIMITE = 450000;   // ~330 Ko par image : on évite de remplir le stockage de l'appareil
      let resultat = "";
      for (const [cote, qualite] of [[1280, .82], [1100, .72], [900, .65], [720, .55], [560, .5]]) {
        const echelle = Math.min(1, cote / Math.max(img.naturalWidth, img.naturalHeight));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.naturalWidth * echelle));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * echelle));
        const c = canvas.getContext("2d");
        c.fillStyle = "#fff";                      // les fonds transparents deviennent blancs
        c.fillRect(0, 0, canvas.width, canvas.height);
        c.drawImage(img, 0, 0, canvas.width, canvas.height);
        resultat = canvas.toDataURL("image/jpeg", qualite);
        if (resultat.length <= LIMITE) break;
      }
      resolve(resultat);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image illisible")); };
    img.src = url;
  });
};

// Ouvre le sélecteur de fichier pour le bloc image donné
App.choisirImage = function (id) {
  const bloc = App.page().blocs.find((b) => b.id === id);
  if (!bloc) return;
  const champ = document.createElement("input");
  champ.type = "file";
  champ.accept = "image/*";
  champ.hidden = true;
  champ.addEventListener("change", async () => {
    const fichier = champ.files && champ.files[0];
    champ.remove();
    if (!fichier) return;
    try {
      const dataUrl = await App.lireImage(fichier);
      bloc.src = App.ImagesDB ? await App.ImagesDB.enregistrer(dataUrl) : dataUrl;
      if (!bloc.texte) bloc.texte = "";
      App.afficherBlocs(id, "fin", id);
    } catch (erreur) {
      App.Toast.afficher("Impossible d'ajouter cette image : " + erreur.message);
    }
  });
  document.body.append(champ);
  champ.click();
};

// Télécharge l'image d'un bloc
App.telechargerImageBloc = async function (bloc) {
  const src = App.ImagesDB ? await App.ImagesDB.obtenir(bloc.src) : bloc.src;
  if (!src) return;
  const nom = ((bloc.texte || "image-focusflow").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase() || "image-focusflow") + ".jpg";
  const lien = App.el("a", { href: src, download: nom });
  document.body.append(lien);
  lien.click();
  lien.remove();
};

// Affiche l'image en grand avec actions rapides
App.agrandirImage = async function (bloc) {
  const src = App.ImagesDB ? await App.ImagesDB.obtenir(bloc.src) : bloc.src;
  if (!src) return;
  const img = App.el("img", { class: "image-grande", src: src, alt: bloc.texte || "Image" });
  const barre = App.el("div", { class: "actions", style: "margin-top:12px" },
    App.el("button", { type: "button", class: "btn-secondaire", onclick: () => { App.Feuille.fermer(); App.choisirImage(bloc.id); } }, "🖼 Changer l'image"),
    App.el("button", { type: "button", class: "btn-secondaire", onclick: () => App.telechargerImageBloc(bloc) }, "⬇️ Télécharger"));
  App.Feuille.ouvrir(bloc.texte || "Image", [img, barre], { large: true });
};

  function raccourci() {

    if (action === "aujourdhui") {

/* =====================================================
   sync.js : synchronisation entre appareils avec le serveur (serveur/main.py)
   Principe : on télécharge la version du serveur, on la fusionne avec la nôtre
   (la page modifiée en dernier gagne), puis on renvoie le résultat.

App.Sync = (function () {
  const CLE = "mes-blocs-sync";
  const $ = (id) => document.getElementById(id);

  let config = lireConfig();
  let enCours = false;
  let encore = false;          // une nouvelle synchro est demandée pendant qu'une autre tourne

  let etat = { code: config.token ? "attente" : "deconnecte", message: "" };

  function lireConfig() {
    const defaut = { url: "", token: "", nom: "", version: 0, auto: true };
    try { return Object.assign(defaut, JSON.parse(localStorage.getItem(CLE) || "{}")); } catch (erreur) { return defaut; }
  }
  function ecrireConfig() {
    try { localStorage.setItem(CLE, JSON.stringify(config)); } catch (erreur) { /* ignoré */ }
  }

  const base = () => String(config.url || "").trim().replace(/\/+$/, ""); // "" = le serveur qui a servi l'appli

  async function requete(methode, chemin, corps, avecJeton, delaiMs) {
    const entetes = { "Content-Type": "application/json" };
    if (avecJeton !== false && config.token) entetes.Authorization = "Bearer " + config.token;
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), delaiMs || 35000) : null;
    try {
      const reponse = await fetch(base() + "/api" + chemin, {
        method: methode,
        headers: entetes,
        body: corps ? JSON.stringify(corps) : undefined,
        signal: ctrl ? ctrl.signal : undefined,
      });
      let donnees = null;
      try { donnees = await reponse.json(); } catch (erreur) { /* pas de JSON */ }
      return { statut: reponse.status, donnees: donnees };
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  const messageErreur = (r) => (r.donnees && typeof r.donnees.detail === "string" ? r.donnees.detail
    : r.donnees && Array.isArray(r.donnees.detail) ? "Nom (3 caractères minimum, sans espace) ou mot de passe (8 caractères minimum) invalide"
    : "Erreur du serveur (" + r.statut + ")");


  /* ---------- État affiché ---------- */

  function majEtat(code, message) {
    etat = { code: code, message: message || "" };
    const point = $("etat-sync");
    if (point) {
      point.dataset.etat = code;
      point.title = message || "";
    }
    const texte = $("texte-sync");
    if (texte) texte.textContent = config.token ? (code === "sync" ? "Synchronisation…" : code === "ok" ? "Synchronisé" : code === "hors-ligne" ? "Hors ligne" : code === "erreur" ? "Erreur" : "Synchronisation") : "Synchronisation";
    const dansFeuille = $("sync-statut");
    if (dansFeuille) dansFeuille.textContent = message || "";
  }

  const heure = () => new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });


  /* ---------- Comparaison et application ---------- */

  // Empreinte d'un ensemble de données, indépendante de l'ordre des pages
  function empreinte(d) {
    return JSON.stringify([
      [...d.pages].sort((a, b) => (a.id < b.id ? -1 : 1)),
      d.corbeille.map((e) => e.id).sort(),
      Object.keys(d.supprimees).sort().map((k) => [k, d.supprimees[k]]),
      d.stats,
    ]);
  }

  const copieLocale = () => App.normaliser(Object.assign(JSON.parse(JSON.stringify(App.donneesExportables())), { __sansDemo: true }));
  const versServeur = (d) => ({ format: "mes-blocs", version: 3, pages: d.pages, corbeille: d.corbeille, supprimees: d.supprimees, stats: d.stats });

  // Applique des données venues du serveur sans perdre le curseur de l'utilisateur
  function appliquer(fusion) {
    const curseur = App.curseurActuel();
    applique = true;
    App.appliquerDonnees(fusion, { sansMaj: true, afficher: false });
    if (App.afficherEntete) {
      App.afficherEntete();
      App.afficherBlocs(null);
      App.afficherPages();
      App.Vues.afficherBoutons();
      if (curseur) App.focaliser(curseur.id, curseur.pos);
    }
    applique = false;
  }


  /* ---------- Synchronisation ---------- */

  async function synchroniser(manuel) {
    if (!config.token) return;
    if (enCours) { encore = true; return; }
    enCours = true;
    majEtat("sync", "Synchronisation…");
    try {
      if (App.ImagesDB) await App.ImagesDB.pret();
      for (let essai = 0; essai < 4; essai++) {
        const lu = await requete("GET", "/donnees");
        if (lu.statut === 401) { deconnecterLocalement("Session expirée : reconnecte-toi"); return; }
        if (lu.statut !== 200) throw new Error(messageErreur(lu));

        const distant = lu.donnees.donnees
          ? App.normaliser(Object.assign({}, lu.donnees.donnees, { __sansDemo: true })) : null;
        const local = copieLocale();
        const fusion = distant ? App.fusionner(local, distant) : local;
        if (empreinte(fusion) !== empreinte(local)) appliquer(fusion);

        if (distant && empreinte(fusion) === empreinte(distant)) { // le serveur est déjà à jour
          config.version = lu.donnees.version;
          ecrireConfig();
          break;
        }
        const envoi = await requete("PUT", "/donnees", { base_version: lu.donnees.version, donnees: versServeur(fusion) });
        if (envoi.statut === 200) { config.version = envoi.donnees.version; ecrireConfig(); break; }
        if (envoi.statut === 409) continue; // un autre appareil a écrit entre-temps : on recommence
        if (envoi.statut === 401) { deconnecterLocalement("Session expirée : reconnecte-toi"); return; }
        throw new Error(messageErreur(envoi));
      }
      majEtat("ok", "Synchronisé à " + heure());
      if (manuel) App.Toast.afficher("Synchronisé ✅");
    } catch (erreur) {
      const horsLigne = erreur instanceof TypeError; // fetch échoue : pas de réseau ou serveur injoignable
      majEtat(horsLigne ? "hors-ligne" : "erreur", horsLigne ? "Serveur injoignable (hors ligne ?)" : erreur.message);
      if (manuel) App.Toast.afficher(horsLigne ? "Serveur injoignable" : erreur.message);
    } finally {
      enCours = false;
      if (encore) { encore = false; planifier(1500); }
    }
  }

  function planifier(delai) {
    if (!config.token || !config.auto) return;
    clearTimeout(minuteur);
    minuteur = setTimeout(() => synchroniser(false), delai);
  }

  function deconnecterLocalement(message) {
    config.token = "";
    config.nom = "";
    config.version = 0;
    ecrireConfig();
    majEtat("deconnecte", message || "");
    if (message) App.Toast.afficher(message);
  }

  // À chaque sauvegarde locale, on synchronise 3 secondes après la dernière modification
  App.ecouteurs.push(() => { if (!applique) planifier(3000); });
  setInterval(() => { if (!document.hidden) planifier(100); }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) planifier(300); });
  window.addEventListener("online", () => planifier(300));


  /* ---------- Fenêtre de connexion ---------- */

  function ouvrir() {
    document.body.classList.remove("menu-ouvert");
    if (config.token) ouvrirConnecte();
    else ouvrirConnexion();
  }

  function ouvrirConnexion() {
    const url = App.el("input", { type: "url", value: config.url, placeholder: "ex. https://focusflow-sync.onrender.com (ou vide si même serveur)", autocomplete: "off", "aria-label": "Adresse du serveur" });
    const nom = App.el("input", { type: "text", placeholder: "ex. manou", autocomplete: "username", autocapitalize: "none", "aria-label": "Nom d'utilisateur" });
    const mdp = App.el("input", { type: "password", placeholder: "8 caractères minimum", autocomplete: "current-password", "aria-label": "Mot de passe" });
    const message = App.el("p", { class: "erreur-form", id: "sync-statut", role: "alert" });
    const infoTest = App.el("p", { class: "aide petit" });

    function verifierAdresse() {
      const adresse = url.value.trim();
      if (adresse && !/^https?:\/\//i.test(adresse)) { message.textContent = "L'adresse doit commencer par http:// ou https://"; return null; }
      if (adresse.startsWith("http://") && location.protocol === "https:" && !/^http:\/\/(localhost|127\.)/.test(adresse)) {
        message.textContent = "Cette appli est en https : le serveur doit l'être aussi.";
        return null;
      }
      return adresse;
    }

    async function testerServeur() {
      message.textContent = "";
      const adresse = verifierAdresse();
      if (adresse === null) return;
      config.url = adresse;
      infoTest.textContent = "⏳ Contact du serveur en cours… (peut prendre 20-30 s si Render sort de veille)";
      try {
        const r = await requete("GET", "/sante", null, false, 35000);
        if (r.statut === 200) {
          ecrireConfig();
          infoTest.textContent = "✅ Serveur en ligne et prêt !";
        } else {
          infoTest.textContent = "";
          message.textContent = "Le serveur a répondu avec le code " + r.statut + ".";
        }
      } catch (e) {
        infoTest.textContent = "";
        message.textContent = "Serveur injoignable. Vérifie l'URL ou lance main.py.";
      }
    }

    async function valider(chemin) {
      message.textContent = "";
      const adresse = verifierAdresse();
      if (adresse === null) return;
      config.url = adresse;
      infoTest.textContent = "⏳ Connexion au serveur…";
      try {
        const r = await requete("POST", chemin, { nom: nom.value.trim(), mot_de_passe: mdp.value }, false, 35000);
        infoTest.textContent = "";
        if (r.statut !== 200) { message.textContent = messageErreur(r); return; }
        config.token = r.donnees.token;
        config.nom = r.donnees.nom;
        config.version = 0;
        ecrireConfig();
        await premiereSynchro();
      } catch (erreur) {
        infoTest.textContent = "";
        message.textContent = "Serveur injoignable. Vérifie l'adresse et que le serveur FastAPI est lancé.";
      }
    }

    App.Feuille.ouvrir("Synchronisation", [
      App.el("p", { class: "aide" }, "Retrouve tes pages sur tous tes appareils (PC + téléphone en 4G) grâce au serveur FastAPI (main.py)."),
      App.el("div", { class: "champ-form" }, App.el("label", null, "Adresse du serveur (Render ou local)"), url),
      App.el("div", { class: "champ-form" }, App.el("label", null, "Nom d'utilisateur"), nom),
      App.el("div", { class: "champ-form" }, App.el("label", null, "Mot de passe"), mdp),
      infoTest,
      message,
      App.el("div", { class: "actions" },
        App.el("button", { type: "button", class: "btn-primaire", onclick: () => valider("/connexion") }, "Se connecter"),
        App.el("button", { type: "button", class: "btn-secondaire", onclick: () => valider("/inscription") }, "Créer un compte"),
        App.el("button", { type: "button", class: "btn-secondaire", onclick: testerServeur }, "Tester le serveur")),
    ]);
  }

  // Première connexion : on demande quoi faire si le serveur contient déjà des données
  async function premiereSynchro() {
    const lu = await requete("GET", "/donnees");
    if (lu.statut !== 200) { await synchroniser(true); ouvrirConnecte(); return; }
    if (!lu.donnees.donnees) { await synchroniser(true); ouvrirConnecte(); return; }

    const distant = App.normaliser(Object.assign({}, lu.donnees.donnees, { __sansDemo: true }));
    App.Feuille.ouvrir("Ce compte contient déjà des pages", [
      App.el("p", null, "Le serveur a " + distant.pages.length + " page" + (distant.pages.length > 1 ? "s" : "") + ". Que faire des pages de cet appareil ?"),
      App.el("div", { class: "actions colonne" },
        App.el("button", { type: "button", class: "btn-primaire", onclick: async () => { await synchroniser(true); ouvrirConnecte(); } }, "Fusionner les deux"),
        App.el("button", { type: "button", class: "btn-secondaire", onclick: async () => {
          App.appliquerDonnees(distant, { sansMaj: true });
          config.version = lu.donnees.version;
          ecrireConfig();
          majEtat("ok", "Synchronisé à " + heure());
          ouvrirConnecte();
        } }, "Utiliser celles du serveur (efface cet appareil)")),
    ]);
  }

  function ouvrirConnecte() {
    const auto = App.el("input", { type: "checkbox", checked: !!config.auto, onchange: () => { config.auto = auto.checked; ecrireConfig(); if (config.auto) planifier(300); } });
    const statut = App.el("p", { class: "aide", id: "sync-statut" }, etat.message);

    App.Feuille.ouvrir("Synchronisation", [
      App.el("p", null, "Connecté en tant que ", App.el("strong", null, config.nom), config.url ? " sur " + config.url : " (ce serveur)"),
      statut,
      App.el("label", { class: "case-form" }, auto, " Synchroniser automatiquement"),
      App.el("div", { class: "actions" },
        App.el("button", { type: "button", class: "btn-primaire", onclick: () => synchroniser(true) }, "Synchroniser maintenant"),
        App.el("button", { type: "button", class: "btn-secondaire", onclick: async () => {
          try { await requete("POST", "/deconnexion"); } catch (erreur) { /* hors ligne : on se déconnecte quand même ici */ }
          deconnecterLocalement("Déconnecté");
          App.Feuille.fermer();
        } }, "Se déconnecter")),
      App.el("p", { class: "aide petit" }, "Tes pages restent sur cet appareil après la déconnexion. Seul le lien avec le serveur est coupé."),
      App.el("details", { class: "zone-danger" },
        App.el("summary", null, "Supprimer mon compte"),
        App.el("p", { class: "aide" }, "Supprime le compte et les données du serveur. Les pages de cet appareil ne sont pas touchées."),
        App.el("button", { type: "button", class: "btn-danger", onclick: async () => {
          if (!(await App.Confirmer("Supprimer définitivement ton compte et tes données sur le serveur ?", "Supprimer"))) return;
          try {
            const r = await requete("DELETE", "/compte");
            if (r.statut !== 200) { App.Toast.afficher(messageErreur(r)); return; }
            deconnecterLocalement("Compte supprimé");
            App.Feuille.fermer();
          } catch (erreur) { App.Toast.afficher("Serveur injoignable"); }
        } }, "Supprimer mon compte")),
    ]);
  }

  majEtat(etat.code, "");
  if (config.token) setTimeout(() => synchroniser(false), 1200);

  return { synchroniser: synchroniser, ouvrir: ouvrir, appel: requete, jeton: () => config.token, adresse: () => base() || location.origin, connecte: () => !!config.token, infos: () => ({ connecte: !!config.token, nom: config.nom, etat: etat }) };
})();

  <script>
"use strict";

/* =====================================================
   push.js : rappels « push » (la notification arrive même appli fermée)
   Il faut : être connecté à un serveur (Synchronisation), une adresse https
   (ou localhost) et avoir autorisé les notifications.
   Le serveur envoie la notification à l'heure de la tâche (serveur/rappels.py).
   ===================================================== */

App.Push = (function () {
  const CLE = "focusflow-push";

  const disponible = () =>
    "serviceWorker" in navigator && "PushManager" in window && "Notification" in window &&
    (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1");

  const actif = () => { try { return localStorage.getItem(CLE) === "1"; } catch (e) { return false; } };
  const memoriser = (v) => { try { v ? localStorage.setItem(CLE, "1") : localStorage.removeItem(CLE); } catch (e) { /* ignoré */ } };

  // La clé publique du serveur arrive en base64url ; l'API veut des octets
  function enOctets(b64) {
    const rempli = (b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
    const brut = atob(rempli);
    return Uint8Array.from(brut, (c) => c.charCodeAt(0));
  }

  async function enregistrer(abonnement) {
    const cles = abonnement.toJSON().keys || {};
    return App.Sync.appel("POST", "/push/abonner", {
      endpoint: abonnement.endpoint, keys: { p256dh: cles.p256dh, auth: cles.auth },
      decalage: new Date().getTimezoneOffset(),
    });
  }

  async function activer() {
    if (!App.Sync.connecte()) { App.Toast.afficher("Connecte d'abord la synchronisation (Paramètres)"); return false; }
    if (!disponible()) { App.Toast.afficher("Les rappels push demandent une adresse https (ou localhost)"); return false; }
    if (!(await App.Rappels.activer())) return false;           // demande la permission des notifications
    try {
      const reg = await navigator.serviceWorker.ready;
      const cle = await App.Sync.appel("GET", "/push/cle");
      if (cle.statut !== 200) { App.Toast.afficher((cle.donnees && cle.donnees.detail) || "Rappels push indisponibles sur ce serveur"); return false; }
      let abonnement = await reg.pushManager.getSubscription();
      if (!abonnement) abonnement = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: enOctets(cle.donnees.cle) });
      const r = await enregistrer(abonnement);
      if (r.statut !== 200) { App.Toast.afficher("Le serveur a refusé l'abonnement (" + r.statut + ")"); return false; }
      memoriser(true);
      App.Sync.synchroniser(false);                              // les tâches doivent être sur le serveur pour qu'il les rappelle
      App.Toast.afficher("Rappels push activés 🔔 (même appli fermée)");
      return true;
    } catch (erreur) {
      App.Toast.afficher("Impossible d'activer les rappels push sur cet appareil");
      return false;
    }
  }

  async function desactiver() {
    memoriser(false);
    try {
      const reg = await navigator.serviceWorker.ready;
      const abonnement = await reg.pushManager.getSubscription();
      if (abonnement) {
        await App.Sync.appel("POST", "/push/desabonner", { endpoint: abonnement.endpoint }).catch(() => {});
        await abonnement.unsubscribe();
      }
    } catch (erreur) { /* ignoré */ }
    App.Toast.afficher("Rappels push désactivés");
  }

  // Au démarrage : on met à jour le fuseau horaire (voyage, heure d'été) et on vérifie que l'abonnement existe encore
  async function entretenir() {
    if (!actif() || !disponible() || !App.Sync.connecte()) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const abonnement = await reg.pushManager.getSubscription();
      if (abonnement) await enregistrer(abonnement);
      else memoriser(false);
    } catch (erreur) { /* hors ligne : on réessaiera */ }
  }
  setTimeout(entretenir, 4000);

  return { disponible: disponible, actif: actif, activer: activer, desactiver: desactiver };
})();

</script>

          App.el("small", null, p.faites + "/" + p.total)))) : null,
      r.tags.length ? App.el("section", { class: "param-section" },

      App.el("p", { class: "aide petit" }, "Calculé par le serveur avec des requêtes SQL sur tes " + g.total + " tâches. Pour aller plus loin : export CSV ou script pandas (dossier « analyse » du projet)."),
      App.el("div", { class: "actions" },

  async function telechargerCsv() {

  // Le jeton reste dans le module de synchronisation : on passe par son interface
  const jeton = () => App.Sync.jeton();

  async function ouvrir() {
    if (!App.Sync.connecte()) {

      const r = await App.Sync.appel("GET", "/analyse");

    }
  }

})();

App.Parametres = (function () {

  const PALETTES = [["neutre", "Neutre"], ["ardoise", "Ardoise"], ["chaud", "Chaud"], ["noir", "Noir"]];

    noir: "Noir profond en thème sombre (économise la batterie sur écran OLED)",
  };

  const SOUS_TITRE_THEME = {
    auto: "Suit le réglage de ton téléphone ou de ton ordinateur",
    clair: "Toujours clair", sombre: "Toujours sombre",
  };

  const RACCOURCIS = [
    ["/", "choisir le type d'un bloc"],
    ["Entrée", "nouveau bloc"],
    ["Tab · Maj+Tab", "décaler un bloc"],
    ["# · ## · - · [] · > · 1.", "titre, liste, tâche, citation… en début de ligne"],
    ["---", "séparateur (puis Entrée)"],
    ["Ctrl+K", "rechercher partout"],
    ["Ctrl+S", "synchroniser ou sauvegarder"],
    ["Ctrl+Z · Ctrl+Y", "annuler · rétablir"],
    ["Ctrl+B · I · U", "gras · italique · souligné"],
    ["Échap", "fermer un menu, quitter le focus"],
  ];

  // Une ligne cliquable : icône, titre, sous-titre, et un petit texte à droite
  function ligne(icone, titre, sousTitre, action, droite) {
    return App.el("button", { type: "button", class: "ligne-action", onclick: action },
      App.el("span", { class: "ligne-icone" }, icone),
      App.el("span", { class: "ligne-texte" }, App.el("strong", null, titre), sousTitre ? App.el("small", null, sousTitre) : null),
      droite ? App.el("span", { class: "ligne-droite" }, droite) : null);
  }

  function section(titre, ...contenu) {
    return App.el("section", { class: "param-section" }, App.el("h3", { class: "titre-section" }, titre), ...contenu);
  }

  function ouvrir() {
    document.body.classList.remove("menu-ouvert");
    App.Feuille.marquerParametres(true);

    /* ----- Apparence ----- */
    const themeActuel = App.etat.theme;
    const segment = App.el("div", { class: "segment", role: "radiogroup", "aria-label": "Thème" },
      THEMES.map(([cle, icone, nom]) => App.el("button", {
        type: "button", role: "radio", "aria-checked": String(themeActuel === cle), class: themeActuel === cle ? "actif" : "",
        onclick: () => { App.definirTheme(cle); ouvrir(); },
      }, icone + " " + nom)));

    // Petit sélecteur à plusieurs boutons pour un réglage (palette, police)
    const choix = (nom, liste, cle) => App.el("div", { class: "segment", role: "radiogroup", "aria-label": nom },
      liste.map(([valeur, libelle]) => App.el("button", {
        type: "button", role: "radio", "aria-checked": String(App.etat.reglages[cle] === valeur), class: App.etat.reglages[cle] === valeur ? "actif" : "",
        "data-valeur": valeur,
        onclick: () => {
          App.etat.reglages[cle] = valeur;
          App.sauver();
          App.appliquerApparence();
          ouvrir();
        },
      }, libelle)));

    const compact = App.el("input", {
      type: "checkbox", role: "switch", checked: App.etat.reglages.compact === true,
      onchange: () => {
        App.etat.reglages.compact = compact.checked;
        App.sauver();
        App.appliquerApparence();
      },
    });

    const animations = App.el("input", {
      type: "checkbox", role: "switch", checked: App.etat.reglages.animations !== false,
      onchange: () => {
        App.etat.reglages.animations = animations.checked;
        App.sauver();
        App.appliquerAnimations();
      },
    });

    /* ----- Données ----- */
    const nbCorbeille = App.etat.corbeille.length;
    const infosSync = App.Sync.infos();
    const rappelsActifs = App.Rappels.actifs();
    const pushActif = App.Push.actif();

    /* ----- Application ----- */
    let installation;
    if (App.Installation.dejaInstallee()) {
      installation = App.el("p", { class: "aide" }, "✅ L'appli est installée sur cet appareil.");
    } else if (App.Installation.disponible()) {
      installation = ligne("📲", "Installer l'appli", "L'ajouter à l'écran d'accueil, comme une vraie appli", async () => {
        await App.Installation.lancer();
        ouvrir();
      }, "Installer");
    } else if (location.protocol === "file:") {
      installation = App.el("p", { class: "aide" },
        "📲 En mode fichier local, FocusFlow fonctionne déjà 100 % hors ligne. Pour l'installer comme application sur ton écran d'accueil, ouvre ce fichier via une adresse https (ex. GitHub Pages) ou localhost, puis choisis « Installer l'application » dans le menu du navigateur.");
    } else {
      installation = App.el("p", { class: "aide" },
        "📲 Pour installer l'appli : ouvre le menu du navigateur (⋮ ou Partager) puis choisis « Installer l'application » ou « Sur l'écran d'accueil ».");
    }

    App.Feuille.ouvrir("Paramètres", [
      section("Apparence",
        segment,
        App.el("p", { class: "aide petit" }, SOUS_TITRE_THEME[themeActuel]),
        App.el("label", { class: "titre-champ" }, "Palette"),
        choix("Palette", PALETTES, "palette"),
        App.el("p", { class: "aide petit" }, AIDE_PALETTE[App.etat.reglages.palette]),
        App.el("label", { class: "titre-champ" }, "Police"),
        choix("Police", POLICES, "police"),
        App.el("label", { class: "ligne-interrupteur" },
          App.el("span", { class: "ligne-texte" }, App.el("strong", null, "Mode compact"), App.el("small", null, "Des blocs plus serrés pour voir plus de contenu")),
          compact),
        App.el("label", { class: "ligne-interrupteur" },
          App.el("span", { class: "ligne-texte" }, App.el("strong", null, "Animations"), App.el("small", null, "Confettis, transitions, effets de fond")),
          animations)),

      section("Mes données",
        ligne("📊", "Statistiques", "Tâches terminées, séries, graphiques", () => App.Donnees.stats(), "›"),
        ligne("🗑", "Corbeille", nbCorbeille ? nbCorbeille + " élément" + (nbCorbeille > 1 ? "s" : "") + " récupérable" + (nbCorbeille > 1 ? "s" : "") : "Vide : les éléments supprimés restent 30 jours", () => App.Donnees.corbeille(), nbCorbeille ? App.el("span", { class: "badge" }, String(nbCorbeille)) : "›"),
        ligne("💾", "Sauvegarde et export", "Fichier JSON, CSV pour Excel ou pandas", () => App.Donnees.sauvegarde(), "›")),

      section("Sur tous mes appareils",
        ligne("☁️", "Synchronisation", infosSync.connecte ? "Connecté en tant que " + infosSync.nom : "Retrouve tes pages sur ton téléphone et ton ordinateur", () => App.Sync.ouvrir(),
          infosSync.connecte ? App.el("span", { class: "point-etat", "data-etat": infosSync.etat.code, title: infosSync.etat.message }) : "›"),
        infosSync.connecte ? ligne("📈", "Mon analyse", "Chiffres calculés en SQL par le serveur", () => App.Analyse.ouvrir(), "›") : null),

      section("Notifications",
        ligne("🔔", "Rappels des tâches", rappelsActifs ? "Activés : une notification à l'heure des tâches (appli ouverte)" : "Désactivés : seul un message dans l'appli s'affiche", async () => {
          if (rappelsActifs) App.Rappels.desactiver();
          else await App.Rappels.activer();
          ouvrir();
        }, rappelsActifs ? "Désactiver" : "Activer"),
        ligne("📲", "Rappels même appli fermée", infosSync.connecte
          ? (pushActif ? "Activés : le serveur t'envoie la notification" : "Le serveur t'envoie la notification à l'heure, téléphone verrouillé")
          : "Demande la synchronisation (ci-dessus) et une adresse https", async () => {
          if (pushActif) await App.Push.desactiver();
          else await App.Push.activer();
          ouvrir();
        }, pushActif ? "Désactiver" : "Activer")),

      section("Application", installation,
        ligne("👋", "Revoir la présentation", "Les astuces de bienvenue", () => App.Accueil.ouvrir(), "›")),

      section("Édition",
        App.el("div", { class: "deux-colonnes" },
          App.el("button", { type: "button", class: "btn-secondaire", onclick: () => { App.Feuille.fermer(); App.Histoire.annuler(); } }, "↶ Annuler"),
          App.el("button", { type: "button", class: "btn-secondaire", onclick: () => { App.Feuille.fermer(); App.Histoire.retablir(); } }, "↷ Rétablir"))),

      App.el("details", { class: "raccourcis" },
        App.el("summary", null, "⌨️ Raccourcis et astuces"),
        App.el("dl", null, RACCOURCIS.map(([touche, texte]) => [App.el("dt", null, touche), App.el("dd", null, texte)]))),

      App.el("p", { class: "aide petit" }, "FocusFlow · version 6.1 · synchro cloud FastAPI, export .ics & stockage IndexedDB."),
    ]);
  }

  // Les boutons ⚙️ (barre latérale et en-tête mobile)
  document.addEventListener("click", (e) => {
    if (e.target.closest('[data-action="parametres"]')) ouvrir();
  });

  return { ouvrir: ouvrir };
})();

</script>
  <script>
"use strict";

/* =====================================================
   app.js : démarrage de l'appli
   (les autres fichiers sont dans le dossier js/)
   ===================================================== */

// Thème (clair, sombre ou automatique) et animations
App.appliquerTheme();
App.appliquerAnimations();
App.appliquerApparence();

// Affiche la dernière page ouverte
App.ouvrirPage(App.etat.courante, false);
App.Vues.afficherBoutons();
App.Histoire.majBoutons();


/* ---------- Clavier du téléphone ----------
   Sur certains téléphones, le clavier cache la barre du bas.
   On la remonte de la hauteur du clavier. */
if (window.visualViewport) {
  const ajuster = () => {
    const decalage = window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop;
    document.documentElement.style.setProperty("--clavier", Math.max(0, Math.round(decalage)) + "px");
  };
  window.visualViewport.addEventListener("resize", ajuster);
  window.visualViewport.addEventListener("scroll", ajuster);
}


/* ---------- Installation sur l'écran d'accueil ----------
   Le navigateur nous prévient quand l'appli est installable ;
   le bouton se trouve dans Paramètres. */
App.Installation = (function () {
  let invitation = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    invitation = e;
  });
  window.addEventListener("appinstalled", () => {
    invitation = null;
    App.Toast.afficher("Appli installée 🎉");
  });

  return {
    disponible: () => !!invitation,
    dejaInstallee: () => !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true,
    lancer: async () => {
      if (!invitation) return;
      invitation.prompt();
      await invitation.userChoice;
      invitation = null;
    },
  };
})();


/* ---------- Raccourcis et mode hors ligne ---------- */
(function () {
  // Ctrl+S / Cmd+S : synchronisation manuelle ou confirmation de sauvegarde locale
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "s") {
      e.preventDefault();
      App.sauver();
      if (App.Sync && App.Sync.connecte()) App.Sync.synchroniser(true);
      else App.Toast.afficher("Sauvegardé localement ✓");
    }
  });

  // Enregistre sw.js uniquement s'il est réellement présent à côté du fichier
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", async () => {
      try {
        const rep = await fetch("sw.js", { method: "HEAD", cache: "no-store" });
        const type = (rep.headers.get("content-type") || "").toLowerCase();
        if (rep.ok && (type.includes("javascript") || type.includes("ecmascript"))) {
          await navigator.serviceWorker.register("sw.js");
        }
      } catch (erreur) {
        // Fichier unique autonome : aucun sw.js externe requis
      }
    });
  }
})();

</script>
